  .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(8,10,20,.45);opacity:0;pointer-events:none;transition:opacity .25s}
  .shell.drawer .scrim{opacity:1;pointer-events:auto}
  .tb-menu{display:grid}
  .topbar{padding:0 12px 0 8px}
  .search-trigger{width:36px;padding:0;justify-content:center;margin-right:0}
  .search-trigger span,.search-trigger kbd{display:none}
  .page{padding:20px 16px 120px}
  .h1{font-size:30px}
  .page-head{align-items:flex-start}
  .page-head>div:first-child{flex-basis:100%}
  .overview{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .fin{display:flex}
  .fin-stats{margin-top:12px}
  .margin{padding-top:12px}
  .kpi-value{font-size:32px}
  .spark{width:56px}
  .alert-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:12px;gap:8px}
  .atile{padding:12px;flex-direction:column;gap:8px}
  .atile .go{display:none}
  .toolbar{position:static;padding:12px}
  .toolbar .search{width:100%;order:3}
  .tb-spacer{display:none}
  .table-wrap.orders-wrap{display:none}
  .order-cards{display:block}
  .ocard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
  .ocard:last-child{border-bottom:0}
  .ocard .seal{grid-row:span 2}
  .ocard .r{text-align:right}
  .ocard .meta{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--text-2)}
  .ocard .meta span{display:inline-flex;align-items:center;gap:5px}
  .table-foot .keys{display:none}
  .board{grid-template-columns:repeat(4,minmax(260px,82vw))}
  .oh-main,.profile-head{flex-wrap:wrap;padding:18px}

  .steps,.stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(2n),.stat-strip>div:nth-child(2n){border-right:0}
  .stat-strip>div:nth-child(3){border-right:1px solid var(--line)}
  .step:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stat-strip>div:nth-child(n+3){border-top:1px solid var(--line)}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loc,.instr,.dr-files{grid-template-columns:minmax(0,1fr)}
  .instr>div+div{border-left:0;border-top:1px solid var(--line)}

  .no-mobile-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(0,0,0,.2)}
  .no-mobile-bar .tx{flex:1;font-size:12.5px;color:var(--text-2);min-width:0}
  .no-mobile-bar .tx b{display:block;color:var(--text);font-size:13.5px}
  .dir-tools .search{width:100%}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
@media print{
  .sidebar,.topbar,.oh-actions,.composer,.dropzone,#toasts,.bulk,.back,.step .link,.loc-actions,.doc-actions,.hint,.dr-foot{display:none !important}
  .shell{display:block}
  body{background:#fff}
  .page{padding:0;max-width:none}

/* =========================================================
   NOTARY NEXXUS — "Graphite & Marigold" visual language
   Loaded after styles.css. One variable grotesk (Archivo) whose
   width axis carries the hierarchy; stone neutrals; marigold accent.
   ========================================================= */
:root{
  --font-ui:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --topbar:56px;
  --r-xl:14px;--r-lg:12px;--r:9px;--r-sm:7px;

  --canvas:#EEF0EC;--surface:#FFFFFF;--surface-2:#F7F8F5;--sunken:#E6E8E3;--hover:#F4F5F1;
  --line:#DEE1DA;--line-strong:#C9CDC4;
  --text:#141613;--text-2:#4C5149;--text-3:#83887F;
  --ink:#141613;--ink-strong:#000;--ink-soft:#FFF1CC;--ink-line:#EFD48E;
  --accent:#F4B63F;--accent-strong:#D9971A;--accent-text:#7A5200;--accent-soft:#FFF1CC;
  --btn:#141613;--btn-hover:#2C2F2A;--btn-text:#FFFFFF;
  --night:#0F110F;--night-2:#1A1D19;--night-line:rgba(255,255,255,.07);
  --night-text:#ECEDE7;--night-text-2:#A3A89F;--night-text-3:#666B62;
  --foil:#C98A12;--foil-soft:#FFF1CC;
  --red:#D33A2E;--red-soft:#FCEBE8;--amber:#C2560C;--amber-soft:#FDEFE4;--green:#1E7F52;--green-soft:#E3F2EA;
  --seal-track:#D7DAD2;
  --shadow-sm:0 1px 2px rgba(20,22,19,.05);
  --shadow-md:0 2px 4px rgba(20,22,19,.04),0 12px 28px -12px rgba(20,22,19,.18);
  --shadow-lg:0 4px 8px rgba(20,22,19,.05),0 28px 64px -20px rgba(20,22,19,.32);
  --ring:0 0 0 3px rgba(244,182,63,.38);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0C0D0B;--surface:#141613;--surface-2:#181A17;--sunken:#10120F;--hover:#1B1E1A;--line:#252823;--line-strong:#33372F;
  --text:#ECEDE7;--text-2:#A7ACA2;--text-3:#737870;--ink:#ECEDE7;--ink-soft:rgba(244,182,63,.12);--ink-line:rgba(244,182,63,.32);
  --accent-text:#F6C766;--accent-soft:rgba(244,182,63,.12);--btn:#F4B63F;--btn-hover:#F7C55F;--btn-text:#141613;
  --night:#090A08;--foil:#F4B63F;--foil-soft:rgba(244,182,63,.12);
  --red:#F26A5E;--red-soft:rgba(242,106,94,.12);--amber:#F08A4B;--amber-soft:rgba(240,138,75,.12);--green:#4CC38A;--green-soft:rgba(76,195,138,.12);--seal-track:#2E322B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 14px 30px -12px rgba(0,0,0,.7);--shadow-lg:0 30px 70px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --canvas:#0C0D0B;--surface:#141613;--surface-2:#181A17;--sunken:#10120F;--hover:#1B1E1A;--line:#252823;--line-strong:#33372F;
  --text:#ECEDE7;--text-2:#A7ACA2;--text-3:#737870;--ink:#ECEDE7;--ink-soft:rgba(244,182,63,.12);--ink-line:rgba(244,182,63,.32);
  --accent-text:#F6C766;--accent-soft:rgba(244,182,63,.12);--btn:#F4B63F;--btn-hover:#F7C55F;--btn-text:#141613;
  --night:#090A08;--foil:#F4B63F;--foil-soft:rgba(244,182,63,.12);
  --red:#F26A5E;--red-soft:rgba(242,106,94,.12);--amber:#F08A4B;--amber-soft:rgba(240,138,75,.12);--green:#4CC38A;--green-soft:rgba(76,195,138,.12);--seal-track:#2E322B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 14px 30px -12px rgba(0,0,0,.7);--shadow-lg:0 30px 70px -18px rgba(0,0,0,.8);
}

/* =========================================================
   TYPE — width axis = hierarchy
   ========================================================= */
body{font-family:var(--font-ui);font-size:14px;letter-spacing:-.006em}
::selection{background:var(--accent);color:#141613}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.h1{font-family:var(--font-ui);font-weight:700;font-stretch:120%;font-size:46px;letter-spacing:-.045em;line-height:.96}
.h2{font-family:var(--font-ui);font-weight:700;font-stretch:115%;letter-spacing:-.03em}
.lede{font-size:14px;color:var(--text-2);margin-top:12px}
.lede b{color:var(--red);font-weight:600}
/* micro caps: expanded, tracked, small */
.micro,.eyebrow,.fgroup-title,.dt th,.sb-label,.tk-l,.sect-h h2,.tlabel,.oh-k,.sum-head .t,.rc-total>span,.stat-strip .k,.kv dt,.bcol-head,.dr-sec h3,.menu-label,.pal-group,.instr .from,.step-top,
.detail-grid .card-title,.two-col .card-title,.set-nav a,.req-head span,.sum-list dt{
  font-family:var(--font-ui);font-size:10.5px;font-weight:650;font-stretch:125%;text-transform:uppercase;letter-spacing:.11em;color:var(--text-3)}
.set-nav a{font-size:11px}
.mono,.ord-no,kbd{font-family:var(--font-mono)}
.seal .n{font-family:var(--font-ui);font-weight:700;font-stretch:118%;letter-spacing:-.05em}
.seal .of{font-family:var(--font-ui);font-stretch:125%}
.seal.complete .edge{fill:var(--accent-soft);stroke:var(--accent-strong)}
.seal.complete .seg{stroke:var(--accent-strong)}
.seal .ck{stroke:var(--accent-text)}

/* =========================================================
   CONTROLS
   ========================================================= */
.btn{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:550;box-shadow:none;border-color:var(--line-strong);background:var(--surface);transition:background .15s,border-color .15s,color .15s,transform .12s cubic-bezier(.2,.7,.2,1)}
.btn:hover{border-color:var(--text-3);background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);border-color:var(--btn);color:var(--btn-text);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 1px 2px rgba(20,22,19,.2)}
.btn-primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn-ink{color:var(--text);border-color:var(--text);background:transparent}
.btn-ink:hover{background:var(--text);color:var(--canvas);border-color:var(--text)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--hover);border-color:transparent}
.btn-sm{height:30px;border-radius:8px;padding:0 10px;font-size:12.5px}
.btn-lg{height:44px;border-radius:11px;font-size:14px;font-weight:600}
.btn.loading{color:transparent !important;position:relative;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid var(--btn-text);border-right-color:transparent;animation:spin .6s linear infinite}
.btn:not(.btn-primary).loading::after{border-color:var(--text);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{border-radius:8px}
.icon-btn.bordered{box-shadow:none;width:34px;height:34px;border-color:var(--line-strong)}
.link{color:var(--text);font-weight:550;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;transition:text-decoration-color .15s}
.link:hover{text-decoration-color:var(--text)}
.link.quiet{color:var(--text-2);text-decoration-color:var(--line-strong)}
a.name-link:hover{color:var(--text);text-decoration-color:var(--accent);text-decoration-thickness:2px}
.input,.select,.textarea{height:38px;border-radius:9px;border-color:var(--line-strong);background:var(--surface);font-size:13.5px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--text);box-shadow:var(--ring)}
.input.sm,.select.sm{height:32px}
.label{color:var(--text);font-weight:550}
.check input,.radio-card input,.dt .cb input{accent-color:var(--text)}
.toggle input:checked+i{background:var(--text)}
.chip{height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600}
.chip.ink{background:var(--accent-soft);color:var(--accent-text)}
.chip.foil{color:var(--accent-text)}
.chip.lg{height:24px}
.fchip{background:var(--surface);border-color:var(--line-strong);color:var(--text);border-radius:999px;height:28px;padding-left:12px}
.fchip button:hover{background:var(--hover)}
.flag-btn{border-radius:9px}
.flag-btn.scan[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--ink-line);color:var(--accent-text)}
.status-pill{border-radius:999px;height:28px;background:var(--surface);border:1px solid var(--line-strong);color:var(--text)}
.status-pill.active .dot,.status-pill .dot{color:var(--green)}
.status-pill.completed{background:var(--accent-soft);border-color:var(--ink-line);color:var(--accent-text)}
kbd{border-radius:5px;box-shadow:0 1px 0 var(--line-strong)}
.filter-count{background:var(--text);color:var(--canvas)}
.radio-card:has(input:checked){border-color:var(--text);background:var(--accent-soft);box-shadow:0 0 0 1px var(--text) inset}

/* Underline tabs — expanded caps, marigold ink */
.toolbar .seg-ctl,.dir-tools .seg-ctl,.summary-strip .seg-ctl{position:relative;background:none;padding:0;gap:0;border-radius:0;overflow:visible}
.toolbar .seg-ctl button,.dir-tools .seg-ctl button,.summary-strip .seg-ctl button{height:52px;padding:0 11px;border-radius:0;background:none !important;box-shadow:none !important;color:var(--text-3);font-size:10.5px;font-weight:650;font-stretch:120%;text-transform:uppercase;letter-spacing:.07em}
.toolbar .seg-ctl button:hover,.dir-tools .seg-ctl button:hover,.summary-strip .seg-ctl button:hover{color:var(--text)}
.toolbar .seg-ctl button.active,.dir-tools .seg-ctl button.active,.summary-strip .seg-ctl button.active{color:var(--text)}
.seg-ctl button .n{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0;font-stretch:100%;padding:1px 5px;border-radius:4px;background:var(--sunken);color:var(--text-3);text-transform:none}
.seg-ctl button.active .n{background:var(--text);color:var(--canvas)}
.tab-ink{position:absolute;bottom:-1px;height:3px;background:var(--accent);border-radius:3px 3px 0 0;pointer-events:none}
.toolbar .seg-ctl.icons{background:var(--sunken);padding:2px;border-radius:9px;gap:2px}
.toolbar .seg-ctl.icons button{height:30px;width:32px;padding:0;border-radius:7px;color:var(--text-3)}
.toolbar .seg-ctl.icons button.active{background:var(--surface) !important;color:var(--text);box-shadow:0 1px 2px rgba(20,22,19,.08) !important}

/* =========================================================
   SIDEBAR — dark, quiet, precise
   ========================================================= */
.shell{--sbw:236px}
.sidebar{background:var(--night);padding:16px 10px 10px;border-right:1px solid rgba(255,255,255,.04)}
.wordmark{font-size:11px;font-weight:700;font-stretch:125%;letter-spacing:.16em;color:#F2F2EC}
.sb-top{margin-bottom:18px}
.sb-new{background:var(--accent);border:0;color:#141613;font-weight:650;height:38px;border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -8px rgba(244,182,63,.6)}
.sb-new:hover{background:#F7C55F}
.sb-new kbd{background:transparent;border-color:rgba(20,22,19,.25);color:rgba(20,22,19,.6);box-shadow:none}
.sb-label{font-size:10px;letter-spacing:.15em;color:#5E6359;padding:24px 12px 8px}
.sb-item{height:36px;border-radius:9px;color:#A3A89F;font-size:13.5px;gap:12px}
.sb-item .ic{color:#6C7167;transition:color .15s}
.sb-item:hover{background:rgba(255,255,255,.045);color:#F2F2EC}
.sb-item:hover .ic{color:#C9CDC4}
.sb-item.active{background:rgba(255,255,255,.075);color:#fff}
.sb-item.active .ic{color:var(--accent)}
.sb-item.active::before{left:-10px;top:9px;bottom:9px;width:3px;background:var(--accent)}
.sb-count{padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#8B9086;font-size:10.5px}
.sb-item.active .sb-count{background:var(--accent);color:#141613}
.sb-bottom{border-top-color:rgba(255,255,255,.06)}
.sb-user .av{background:var(--accent);color:#141613}
.sb-btn:hover{background:rgba(255,255,255,.06)}
.collapsed .sb-label{background:rgba(255,255,255,.06)}

/* Topbar + page frame */
.topbar{height:56px;padding:0 40px;background:color-mix(in srgb,var(--canvas) 86%,transparent);border-bottom-color:transparent;transition:border-color .2s}
.crumbs{font-size:12.5px}
.crumbs .cur{font-weight:600}
.search-trigger{height:34px;border-radius:10px;background:var(--surface);border-color:var(--line)}
.page{max-width:1440px;padding:32px 40px 96px}
.page-head{margin-bottom:28px;align-items:flex-end;gap:16px 32px}
.page-head .eyebrow{margin-bottom:12px}
.back{font-size:12.5px;color:var(--text-3);margin-bottom:20px}
.back:hover{color:var(--text)}

/* =========================================================
   ORDERS — ticker, queue, day timeline, sheet
   ========================================================= */
.ticker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.45fr);border-top:1px solid var(--text);border-bottom:1px solid var(--line)}
.tk{position:relative;padding:16px 20px 18px 0;min-width:0}
.tk+.tk{padding-left:20px;border-left:1px solid var(--line)}
.tk-l{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.tk-l span{opacity:.6}
.tk-l .link{margin-left:auto;font-size:12px;text-transform:none;letter-spacing:0;font-stretch:100%;font-weight:550}
.tk-v{font-size:40px;font-weight:650;font-stretch:118%;letter-spacing:-.05em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.tk-d{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-size:12px;color:var(--text-3);white-space:nowrap}
.delta{background:none !important;padding:0;font-size:12px;font-weight:600}
.tk .spark{position:absolute;right:20px;top:50px;width:70px;height:28px}
.spark path.l{stroke:var(--text-2);stroke-width:1.4}
.spark path.a{fill:var(--accent);opacity:.22}
.spark circle{fill:var(--accent-strong)}
.tk-split{display:flex;gap:3px;height:6px;margin-top:14px}
.tk-split i{display:block;height:100%;border-radius:2px;background:var(--line-strong)}
.tk-split i+i{background:var(--accent)}
.tk-legend{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;color:var(--text-3)}
.ov-wrap{overflow:hidden}

.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);margin:32px 0 36px}
.queue{padding-right:32px;border-right:1px solid var(--line);min-width:0}
.day{padding-left:32px;min-width:0}
.sect-h{display:flex;align-items:center;gap:8px;margin-bottom:16px;min-height:24px}
.sect-h h2{color:var(--text)}
.sect-sub{font-size:12.5px;color:var(--text-3)}
.sect-h .spacer{flex:1}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:14px;row-gap:2px;align-items:center;padding:16px 18px;background:var(--surface);border:0;text-align:left;color:inherit;position:relative;transition:background .15s}
.q-n{grid-row:1/3;font-size:38px;font-weight:650;font-stretch:120%;letter-spacing:-.05em;line-height:1;color:var(--red);min-width:30px;font-variant-numeric:tabular-nums}
.q-l{font-weight:600;font-size:13.5px;line-height:1.3}
.q-ids{grid-column:2;font-family:var(--font-mono);font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt .go{grid-row:1/3;grid-column:3;color:var(--text-3);opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s}
.qt:hover{background:var(--surface-2)}
.qt:hover .go{opacity:1;transform:none}
.qt.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.qt.active .go{opacity:1;transform:none;color:var(--text)}
.qt[disabled]{cursor:default}
.qt[disabled] .q-n{color:var(--text-3);opacity:.6}
.qt[disabled]:hover{background:var(--surface)}

.day-track{position:relative;height:166px;margin:0 70px 0 64px}
.day-hours span{position:absolute;top:0;transform:translateX(-50%);font:500 10.5px var(--font-mono);color:var(--text-3);white-space:nowrap}
.day-hours span.now-l{color:var(--red);font-weight:600}
.day-line{position:absolute;left:-12px;right:-12px;top:28px;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}
.day-past{position:absolute;left:-12px;top:28px;height:2px;border-radius:2px;background:var(--text-2)}
.day-now{position:absolute;top:20px;width:2px;height:18px;border-radius:2px;background:var(--red);transform:translateX(-50%)}
.day-now::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--red-soft)}
.dm{position:absolute;top:23px;width:172px;transform:translateX(-50%);padding:0;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;border-radius:11px}
.dm:focus-visible{outline:none}
.dm:focus-visible .dm-card{outline:2px solid var(--accent-strong);outline-offset:2px}
.dm-dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--surface);border:2px solid var(--text-3)}
.dm-stem{width:1px;height:14px;background:var(--line-strong);flex:none}
.dm.dn .dm-stem{height:68px}
.dm-card{display:grid;gap:2px;width:172px;padding:9px 11px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .2s,transform .2s}
.dm:hover .dm-card,.dm:focus-visible .dm-card{border-color:var(--text-3);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.dm-card b{font:600 11.5px var(--font-mono);color:var(--text-2)}
.dm-r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dm-card .nm{font-weight:600;font-size:13px}
.dm-card em{font-style:normal;font-size:11.5px;font-weight:600}
.dm.done .dm-dot{background:var(--accent);border-color:var(--accent-strong)}
.dm.done em{color:var(--accent-text)}
.dm.late .dm-dot{background:var(--red);border-color:var(--red)}
.dm.late em{color:var(--red)}
.dm.next .dm-dot{background:var(--text);border-color:var(--text);box-shadow:0 0 0 4px var(--accent-soft)}
.dm.next em{color:var(--text-2)}
.day-list{display:none}

.orders-card{scroll-margin-top:calc(var(--topbar) + 8px)}
.toolbar{position:sticky;top:var(--topbar);z-index:12;background:color-mix(in srgb,var(--canvas) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;min-height:53px;gap:10px}
.toolbar .search{width:190px}
.toolbar .search .input{height:34px}
.toolbar .btn-sm{height:34px !important}
.sheet{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.active-filters{background:var(--surface-2);padding:10px 20px}
.table-foot{font-size:12px;padding:12px 20px}

/* Tables */
.dt th{background:var(--surface-2);height:38px;border-bottom:1px solid var(--line);font-size:10px}
.th-sort{color:inherit}
.th-sort .ic{opacity:0}
.th-sort:hover .ic,.th-sort.on .ic{opacity:1;color:var(--text)}
.th-sort.on{color:var(--text)}
.dt td{border-bottom-color:var(--line)}
.dt tbody tr:hover>td{background:var(--surface-2)}
.dt tbody tr.selected>td,.dt tbody tr.peeked>td{background:var(--accent-soft)}
.orders td{height:70px}
.orders td.cb{box-shadow:inset 3px 0 0 var(--rail,transparent);transition:box-shadow .2s}
.orders tr:hover td.cb{box-shadow:inset 5px 0 0 var(--rail,transparent)}
.dt tbody tr.peeked>td:first-child{box-shadow:inset 5px 0 0 var(--accent)}
.rail-red{--rail:var(--red)}.rail-amber{--rail:var(--amber)}.rail-green{--rail:var(--green)}.rail-gold{--rail:var(--accent)}.rail-mute{--rail:var(--line-strong)}
.orders tr.grp td{background:var(--canvas);padding:8px 20px;border-top:1px solid var(--line);font-size:10px;font-weight:650;font-stretch:125%;letter-spacing:.11em;color:var(--text-2);text-transform:uppercase}
.orders tr.grp .n{font-family:var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px;letter-spacing:0}
.ord-no{font-size:13px;font-weight:600}
.cell-1{font-weight:550}
.loc-type{font-size:10px;font-weight:650;font-stretch:125%;letter-spacing:.1em;color:var(--text-2)}
.sg-date{font-weight:600}
.sg-date.today{color:var(--text)}
.sg-date.today .dot{color:var(--accent-strong)}
.sg-date.warn,.sg-time.tbd,.tm-pending{color:var(--amber)}
.rel-chip{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.rel-chip.late{background:var(--red-soft);color:var(--red)}
.prog-s.done{color:var(--accent-text)}
.av.xs{width:18px;height:18px;font-size:8.5px}
.av-empty{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--text-3);flex:none;font-size:8px;font-weight:700}
.av-empty.pend{border-color:var(--amber);color:var(--amber)}
.tm{gap:8px;line-height:1.8}
.board{background:var(--canvas);gap:16px;padding:18px}
.bcard{border-radius:12px;border-top:3px solid var(--rail,var(--line))}
.bcard.peeked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ocard{box-shadow:inset 3px 0 0 var(--rail,transparent)}
.bulk{background:#171917;border:1px solid #2B2F29}
.bulk .btn{border-radius:8px}

/* =========================================================
   ORDER DETAIL — huge number, progress track, document + inspector
   ========================================================= */
.oh{background:none;border:0;box-shadow:none;overflow:visible;border-radius:0}
.oh-main{padding:0 0 28px;align-items:flex-start;gap:24px}
.oh-row{align-items:flex-end;gap:14px}
.oh-row .h1{font-size:68px;letter-spacing:-.06em;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:.9}
.oh-k{display:block;margin-bottom:12px;line-height:1}
.oh-meta{margin-top:14px}
.oh-meta .ic{color:var(--text-3)}
.track{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:4px 0 30px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.track-line{position:absolute;left:14px;right:14px;top:18px;height:2px;background:var(--line-strong)}
.tstep{position:relative;min-width:0}
.tnode{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--canvas);border:2px solid var(--line-strong);font:600 12px var(--font-mono);color:var(--text-3)}
.tstep.ok .tnode{background:var(--text);border-color:var(--text);color:var(--canvas)}
.tstep.need .tnode{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.track.complete .tnode{background:var(--accent);border-color:var(--accent-strong);color:#141613}
.tlabel{display:flex;align-items:center;gap:8px;margin-top:14px}
.tlabel em{font-style:normal;color:var(--red);letter-spacing:.06em}
.tval{margin-top:6px;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tval.none{color:var(--text-3);font-weight:450}
.tstep .link{margin-top:8px}

.detail-grid{grid-template-columns:minmax(0,1fr) 380px;gap:44px;margin-top:28px}
.detail-grid>.stack:first-child,.no-grid>.stack{gap:0}
.detail-grid>.stack:first-child>.card{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:32px;padding:28px 0;background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.detail-grid>.stack:first-child>.card:first-child{border-top:0;padding-top:0}
.detail-grid>.stack:first-child>.card>.card-head{grid-column:1;grid-row:1/span 12;flex-direction:column;align-items:flex-start;gap:10px;padding:2px 0 0;border:0;min-height:0}
.detail-grid>.stack:first-child>.card>.card-head .spacer{display:none}
.detail-grid>.stack:first-child>.card>.card-head .hint{white-space:normal}
.detail-grid>.stack:first-child>.card>*:not(.card-head){grid-column:2}
.detail-grid>.stack:first-child .card-body{padding:0}
.detail-grid>.stack:first-child .docs li{padding:14px 0}
.detail-grid>.stack:first-child .docs li:first-child{padding-top:0}
.detail-grid>.stack:first-child .dropzone{margin:14px 0 0;width:100%}
.detail-grid>.stack:first-child .thread{padding:0}
.detail-grid>.stack:first-child .msg:first-child{padding-top:0}
.detail-grid>.stack:first-child .composer{margin:14px 0 0}
.detail-grid>.stack:first-child .instr>div{padding:0 24px 0 0}
.detail-grid>.stack:first-child .instr>div+div{padding:0 0 0 24px}
.fgroup{padding:0 0 24px}
.fgroup+.fgroup{padding-top:24px}
.f dt{font-size:12px;color:var(--text-3)}
.f dd{font-weight:550}
.ocr{background:var(--surface);border-radius:9px}
.ocr .ic{color:var(--accent-strong)}
.doc-ic{background:var(--surface)}
.dropzone{border-radius:12px;border-style:dashed}
.dropzone:hover,.dropzone.over{border-color:var(--text);background:var(--accent-soft)}
.dropzone b{color:var(--text);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.composer{border-radius:12px;background:var(--surface)}
.composer:focus-within{border-color:var(--text);box-shadow:var(--ring)}
.map{border-radius:12px}
.pin{color:var(--text)}
.pin-ring{background:rgba(244,182,63,.4)}

/* Inspector panels (order detail, client/notary profiles) */
.detail-grid>aside.stack,.two-col>aside.stack{gap:0;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:clip;box-shadow:var(--shadow-sm)}
.detail-grid>aside>.card,.two-col>aside>.card{background:none;border:0;border-radius:0;box-shadow:none}
.detail-grid>aside>.card+.card,.two-col>aside>.card+.card{border-top:1px solid var(--line)}
.detail-grid>aside .card-head,.two-col>aside .card-head{padding:18px 20px 6px;border:0;min-height:0}
.detail-grid>aside .card-foot,.two-col>aside .card-foot{border-radius:0;background:var(--surface-2)}
.card-ic{display:none}
.inv-pay .v,.bill-row.total .v,.inv-total .v,.dr-files b,.nstats .v,.stat-strip .v{font-family:var(--font-ui);font-weight:650;font-stretch:115%;letter-spacing:-.04em}
.sugg,.inv,.dr-steps,.dr-files a{border-radius:11px}
.sugg button.picked{background:var(--accent-soft)}
.sugg .pk{color:var(--text)}
.bill-bar i+i{background:var(--accent) !important}
.bill-legend i[style*="green"]{background:var(--accent) !important}
.receipts .ic{color:var(--green)}
.tl-dot.ink{border-color:var(--text);background:var(--text)}
.tl-dot.foil{border-color:var(--accent-strong);background:var(--accent)}

/* =========================================================
   CARDS (remaining uses) + profiles
   ========================================================= */
.card{border-radius:14px;box-shadow:var(--shadow-sm);border-color:var(--line)}
.card-head{border-bottom:0;padding:18px 20px 10px;min-height:0}
.card-title{font-size:14px;font-weight:650;letter-spacing:-.01em}
.card-count{background:none;padding:0}
.card-foot{background:transparent}
.card-head+.table-wrap .dt th{border-top:1px solid var(--line)}
.card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.card:has(>.profile-head){background:none;border:0;box-shadow:none;border-radius:0}
.profile-head{padding:0 0 24px;align-items:flex-end}
.profile-head .h1{font-size:52px}
.stat-strip{background:none;border-top:1px solid var(--text);border-bottom:1px solid var(--line);border-radius:0}
.card:has(>.stat-strip:only-child){background:none;border:0;box-shadow:none;border-radius:0}
.card:has(>.stat-strip:only-child)>.stat-strip{border-top:1px solid var(--text) !important}
.stat-strip>div{padding:14px 20px 18px;border-right:0}
.stat-strip>div:first-child{padding-left:0}
.stat-strip>div+div{border-left:1px solid var(--line)}
.stat-strip .v{font-size:30px;margin-top:10px}
.stat-strip .v.sm{font-size:15px;font-stretch:100%;letter-spacing:0;font-weight:600}
.two-col{grid-template-columns:minmax(0,1fr) 360px;gap:40px;margin-top:32px}
.people li,.price-row{padding-left:20px;padding-right:20px}
.price-row .money{font-weight:500}
.days span.on{background:var(--text);color:var(--canvas)}
.banner{border-radius:12px;background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.banner .ic{color:var(--accent-strong)}
.banner.amber{background:var(--surface);box-shadow:inset 3px 0 0 var(--amber)}

/* Notary roster */
.roster{table-layout:fixed;min-width:900px}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.stat .dot{width:7px;height:7px}
.stat.green .dot{color:var(--green)}.stat.amber .dot{color:var(--amber)}.stat.ink .dot{color:var(--accent-strong)}.stat .dot{color:var(--text-3)}
.meter{display:flex;align-items:center;gap:12px}
.meter b{font-family:var(--font-ui);font-weight:650;font-stretch:115%;font-size:17px;letter-spacing:-.03em;min-width:34px;font-variant-numeric:tabular-nums}
.mbar{flex:1;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;max-width:110px}
.mbar i{display:block;height:100%;background:var(--text-2);border-radius:3px;transform-origin:left}
.left-bar{display:block;height:3px;border-radius:2px;background:var(--sunken);margin-top:6px;overflow:hidden;max-width:140px}
.left-bar i{display:block;height:100%;background:var(--green);border-radius:2px}
.left-bar.warn i{background:var(--amber)}
.langs{display:flex;gap:5px;flex-wrap:wrap}

/* =========================================================
   NEW ORDER — numbered steps + order ticket
   ========================================================= */
.no-grid{grid-template-columns:minmax(0,1fr) 340px;gap:44px}
.no-grid>.stack{counter-reset:sec}
.no-grid .sec{display:grid;grid-template-columns:190px minmax(0,1fr);column-gap:32px;padding:30px 0;background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.no-grid .sec:first-child{border-top:0;padding-top:4px}
.no-grid .sec:not(.hidden){counter-increment:sec}
.no-grid .sec-head{grid-column:1;grid-row:1/span 6;flex-direction:column;align-items:flex-start;gap:8px;padding:0;border:0}
.no-grid .sec-head h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.no-grid .sec-head .st{margin-left:0}
.no-grid .sec>*:not(.sec-head){grid-column:2}
.no-grid .sec-body{padding:0}
.no-grid .sec-ic{width:auto;height:auto;background:none;border:0;color:var(--text-3);font:650 30px/1 var(--font-ui);font-stretch:120%;letter-spacing:-.05em;transition:color .3s}
.no-grid .sec-ic svg{display:none}
.no-grid .sec-ic::before{content:counter(sec,decimal-leading-zero)}
.no-grid .sec-done .sec-ic{background:none;color:var(--green)}
.no-grid #sec-docs .dropzone{margin:0;width:100%}
.no-grid #sec-docs>div:last-child{padding:12px 0 0 !important;margin:0 !important}
.no-grid #draft-docs .docs{border:0 !important}
.no-grid #draft-docs .docs li{padding:0 0 14px}

.sum{top:calc(var(--topbar) + 24px)}
.receipt{position:relative;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:20px 22px 30px;filter:drop-shadow(0 2px 6px rgba(20,22,19,.06));-webkit-mask:radial-gradient(circle at 9px 100%,transparent 6px,#000 6.5px) 0 0/18px 100% repeat-x;mask:radial-gradient(circle at 9px 100%,transparent 6px,#000 6.5px) 0 0/18px 100% repeat-x}
.receipt .sum-head{padding:0 0 16px}
.receipt .sum-head .chip{background:var(--accent-soft);color:var(--accent-text)}
.receipt .sum-seal{padding:0 0 18px;border-bottom:1px dashed var(--line-strong)}
.receipt .sum-seal .t{color:var(--text);font-family:var(--font-ui);font-size:19px;font-weight:700;font-stretch:112%;letter-spacing:-.03em}
.receipt .sum-seal .s{color:var(--text-3)}
.receipt .sum-list{padding:10px 0}
.receipt .sum-list>div{display:flex;align-items:baseline;gap:10px;padding:7px 0;border:0;background:radial-gradient(circle,var(--line-strong) 1px,transparent 1.4px) 0 calc(100% - 9px)/6px 3px repeat-x}
.receipt .sum-list dt{background:var(--surface);padding-right:6px;flex:none}
.receipt .sum-list dd{margin-left:auto;background:var(--surface);padding-left:6px;text-align:right;color:var(--text);font-weight:550;max-width:70%}
.receipt .sum-list dd.none{color:var(--text-3)}
.receipt .sum-list dd .s{color:var(--text-3);font-weight:400}
.rc-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px dashed var(--line-strong);border-bottom:1px dashed var(--line-strong)}
.rc-total b{font-family:var(--font-ui);font-size:26px;font-weight:700;font-stretch:115%;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.receipt .req{background:none;border:0;padding:16px 0 4px}
.receipt .req-head{color:var(--text-3)}
.receipt .req-head b{color:var(--text)}
.receipt .req-bar{background:var(--sunken);height:4px}
.receipt .req-bar i{background:var(--text)}
.receipt .req-bar.full i{background:var(--green)}
.receipt .req li button{color:var(--text-3)}
.receipt .req li button:hover,.receipt .req li.ok button{color:var(--text)}
.receipt .req .bx{border-color:var(--line-strong)}
.receipt .req li.ok .bx{background:var(--green);border-color:var(--green);color:#fff}
.receipt .sum-cta{padding:14px 0 0}
.receipt .sum-cta .btn-primary{background:var(--btn);color:var(--btn-text)}
.receipt .sum-cta .btn[disabled]{background:var(--sunken);border-color:var(--sunken);color:var(--text-3)}
.receipt .fine{color:var(--text-3)}
.no-mobile-bar{background:var(--surface)}

/* =========================================================
   DIRECTORY, REPORTS, SETTINGS
   ========================================================= */
.dir-tools{padding:0 16px 0 8px;min-height:53px;border-bottom-color:var(--line)}
.dir-tools .input{height:34px}
.summary-strip{border-bottom:1px solid var(--line);margin-bottom:20px}
.summary-strip .seg-ctl button{height:44px}
.cols .col i{background:var(--text-2);opacity:.75;border-radius:5px 5px 0 0}
.cols .col:hover i{opacity:1;background:var(--text)}
.cols .col.today i{background:var(--accent);opacity:1}
.hb .tr{height:8px;border-radius:0 4px 4px 0}
.hb .tr i{background:var(--text-2)}
.hb:hover .tr i{background:var(--accent-strong)}
.hb .vl{font-weight:500}
.set-nav a{height:38px;border-radius:9px;color:var(--text-3)}
.set-nav a.active{background:var(--surface);color:var(--text);box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px var(--line)}
.set-nav a.active .ic{color:var(--accent-strong)}
.set-row .t{font-weight:600}

/* =========================================================
   OVERLAYS — graphite popovers echo the sidebar
   ========================================================= */
.menu,.palette,.tip,.toast{--o-bg:#171917;--o-line:#2B2F29;--o-text:#E9EAE4;--o-mut:#878C82}
.menu{background:var(--o-bg);border-color:var(--o-line);color:var(--o-text);box-shadow:0 22px 50px -14px rgba(0,0,0,.5);border-radius:12px}
.menu .mi{color:var(--o-text);border-radius:7px}
.menu .mi:hover,.menu .mi:focus-visible{background:rgba(255,255,255,.07)}
.menu .mi .ic,.menu .mi .r,.menu .muted,.menu .menu-label{color:var(--o-mut)}
.menu .mi.on .r{color:var(--accent)}
.menu .mi.danger,.menu .mi.danger .ic{color:#FF8E84}
.menu .menu-sep{background:var(--o-line)}
.menu .notif:hover{background:rgba(255,255,255,.06)}
.menu .notif .tx{color:#B9BDB3}
.menu .notif .tx b,.menu b{color:#fff}
.menu .notif .tm{color:var(--o-mut)}
.menu .notif.unread .tx::after{background:var(--accent)}
.menu .link{color:#fff}
.menu input[type=checkbox]{accent-color:var(--accent)}
.palette{background:var(--o-bg);border-color:var(--o-line);color:var(--o-text);border-radius:16px}
.pal-in{border-bottom-color:var(--o-line)}
.pal-in input{color:#fff}
.pal-in input::placeholder{color:var(--o-mut)}
.pal-in .ic{color:var(--o-mut)}
.pal-item{color:var(--o-text)}
.pal-item.hl{background:rgba(255,255,255,.07)}
.pal-item .pi{background:#22251F;color:#B9BDB3}
.pal-item .mt,.pal-item .r,.pal-group{color:var(--o-mut)}
.pal-foot{background:#131512;border-top-color:var(--o-line);color:var(--o-mut)}
.palette kbd{background:#1E211C;border-color:#33372F;color:#9DA296;box-shadow:none}
.palette .seal .edge{fill:#1E211C;stroke:#3A3F37}.palette .seal .inner{stroke:#2B2F29}.palette .seal .seg{stroke:#33372F}.palette .seal .seg.on{stroke:#E9EAE4}
.palette .empty h3{color:#fff}.palette .empty p{color:#9DA296}
.palette-scrim,.modal-scrim{background:rgba(12,13,11,.42);backdrop-filter:blur(3px)}
.tip{background:var(--o-bg);border-color:var(--o-line)}
.tip .ok{color:var(--accent)}
.toast{background:var(--o-bg);border-color:var(--o-line);border-radius:12px}
.toast>.ic{color:var(--accent)}
.modal{border-radius:16px}
.modal-head h2{font-size:18px;font-weight:700;font-stretch:112%;letter-spacing:-.03em}
.modal-foot{background:var(--surface-2)}
.drawer{background:var(--surface)}
.dr-hero h2{font-family:var(--font-ui);font-weight:700;font-stretch:115%;font-size:30px;letter-spacing:-.045em}
.dr-step .k{font-size:12px}
.paper{font-family:var(--font-ui)}

/* =========================================================
   AUTH
   ========================================================= */
.auth-brand::before,.auth-brand::after{display:none}
.auth-brand{background:var(--night)}
.guilloche{position:absolute;right:-18%;bottom:-24%;width:min(820px,95%);aspect-ratio:1;pointer-events:none;z-index:0}
.guilloche path{fill:none;stroke:rgba(244,182,63,.085);stroke-width:.6}
.auth-eyebrow{font-stretch:125%}
.auth-eyebrow .dot{color:var(--accent);box-shadow:0 0 0 4px rgba(244,182,63,.18)}
.auth-h{font-family:var(--font-ui);font-weight:700;font-stretch:120%;letter-spacing:-.05em;line-height:.94;font-size:clamp(44px,5.2vw,74px)}
.auth-h em{font-style:normal;color:var(--accent)}
.auth-demo{background:none;border:0;border-top:1px solid rgba(255,255,255,.1);border-radius:0;padding:26px 0 0;margin-top:44px}
.on-night .seal .seg.on{stroke:#ECEDE7}
.on-night .seal.complete .edge{fill:rgba(244,182,63,.12);stroke:var(--accent)}
.on-night .seal.complete .seg{stroke:var(--accent)}
.on-night .seal .ck{stroke:var(--accent)}
.auth-legend li.on .q path.on{stroke:#ECEDE7}
.auth-legend li.on.gold .q path.on{stroke:var(--accent)}
.auth-title{font-family:var(--font-ui);font-weight:700;font-stretch:118%;letter-spacing:-.045em;font-size:36px}
.logo-lockup .wm{font-stretch:125%;font-weight:700;letter-spacing:.16em}
.btn-google{height:44px;border-radius:11px}
#auth-slot{width:100%;max-width:460px}
.auth-form{width:100%}
.auth-done{border-radius:14px}
.auth-done .ok{background:var(--accent-soft);color:var(--accent-text)}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1360px){
  .ticker{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tk-fin{grid-column:1/-1;border-left:0 !important;padding-left:0 !important;border-top:1px solid var(--line);display:grid;grid-template-columns:auto auto 1fr;column-gap:32px;align-items:end}
  .tk-fin .tk-l{grid-column:1/-1}
  .tk-fin .tk-split{grid-column:3;margin-top:0;align-self:center}
  .tk-fin .tk-legend{grid-column:3}
}
@media (max-width:1180px){
  .band{grid-template-columns:minmax(0,1fr)}
  .queue{padding:0 0 28px;border-right:0;border-bottom:1px solid var(--line)}
  .day{padding:28px 0 0}
  .detail-grid,.no-grid,.two-col{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .topbar{padding:0 12px 0 8px}
  .page{padding:20px 16px 120px}
  .h1{font-size:36px}
  .ticker{grid-template-columns:1fr 1fr}
  .tk{padding:14px 12px 14px 0 !important;border-left:0 !important}
  .tk:nth-child(even){padding-left:16px !important;border-left:1px solid var(--line) !important}
  .tk:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .tk-v{font-size:30px}
  .tk .spark{display:none}
  .tk-fin{display:block}
  .qt{padding:12px 14px;column-gap:10px}
  .q-n{font-size:28px}
  .qt .go{display:none}
  .day-track{display:none}
  .day-list{display:block}
  .toolbar{position:static;padding:8px 0;flex-wrap:wrap}
  .toolbar .seg-ctl:not(.icons),.summary-strip .seg-ctl,.dir-tools .seg-ctl{width:100%;overflow-x:auto;overflow-y:hidden}
  .summary-strip>div:last-child{width:100% !important;padding-bottom:12px}
  .toolbar .seg-ctl button{height:42px}
  .toolbar .search{width:100%;order:3}
  .oh-row .h1{font-size:46px}
  .track{grid-template-columns:1fr 1fr;row-gap:22px}
  .track-line{display:none}
  .detail-grid>.stack:first-child>.card,.no-grid .sec{grid-template-columns:minmax(0,1fr)}
  .detail-grid>.stack:first-child>.card>.card-head,.no-grid .sec-head{grid-row:auto;margin-bottom:16px}
  .detail-grid>.stack:first-child>.card>*:not(.card-head),.no-grid .sec>*:not(.sec-head){grid-column:1}
  .no-grid .sec-head{flex-direction:row;align-items:center}
  .no-grid .sec-ic{font-size:22px}
  .detail-grid>.stack:first-child .instr>div,.detail-grid>.stack:first-child .instr>div+div{padding:0}
  .detail-grid>.stack:first-child .instr>div+div{padding-top:16px}
  .profile-head .h1{font-size:36px}
  .stat-strip>div:first-child{padding-left:20px}
  .stat-strip>div{padding:12px 16px}
  .stat-strip>div:nth-child(odd){padding-left:0}
}
@media (max-width:480px){.q-grid{grid-template-columns:minmax(0,1fr)}}

/* fixes after review */
.card.oh{background:none;border:0;box-shadow:none;border-radius:0}
.detail-grid .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
.detail-grid .card-title{white-space:normal;line-height:1.5}
@media (max-width:900px){.detail-grid .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{gap:6px}
.toolbar .search{width:180px}
.dm.dn .dm-stem{height:78px}
.day-track{height:176px}

function startHero() {

    const host = $('#hero-seal'); if (!host) { clearInterval(heroTimer); heroTimer = null; return; }
    host.innerHTML = seal([0, 1, 2, 3].map(i => i < k), 112, { center: true, tip: false, draw: k > 0 && k <= 4 });
    $$('#hero-legend li').forEach((li, i) => { li.classList.toggle('on', i < k); li.classList.toggle('gold', k >= 4); li.querySelector('.q').classList.toggle('complete', k >= 4); });

function placeOrder() {
  const d = S.draft, missing = REQ.filter(r => !r.test(d));

    return;
  }
  const id = S.nextId++;
  const o = O({ id, file: d.file.trim(), created: 'Nov 19, 2026 · 2:15 PM', date: d.date || null, time: d.time ? to12h(d.time) : null, tz: (d.tz.match(/\((\w+)\)/) || [, 'MST'])[1], signer: d.signer.trim(), phone: d.phone, sms: d.smsSame ? d.phone : d.sms, email: d.email, cc: d.cc, type: d.type, street: d.street || 'Address to be confirmed', unit: d.unit, city: d.city || '—', st: (d.st || 'AZ').toUpperCase(), zip: d.zip, client: d.client, orderedBy: d.orderedBy, scheduler: d.scheduler || null, notary: null, flags: d.flags.slice(), docs: d.docs.length });
  if (d.type === 'Delivery' && (d.make || d.vin)) o.vehicle = { year: d.year, make: d.make, model: d.model, vin: d.vin.toUpperCase() };
  if (d.type === 'Delivery' && d.driver) { const dr = S.drivers.find(x => x.name === d.driver); o.driver = { name: dr.name, phone: dr.phone }; }
  o.docsList = d.docs.map(x => ({ name: x.name, kind: x.kind, pages: x.pages, size: x.size, by: 'Jonathan Means', at: 'Just now', ocr: { state: 'done', sig: Math.max(1, Math.round(x.pages / 4)), text: `<b>Read ${x.pages} pages.</b> ${Math.max(1, Math.round(x.pages / 4))} signature lines found.` } }));
  o.messages = []; o.activity = [{ t: 'Just now', txt: 'Order created by <b>Jonathan Means</b>', c: 'ink' }];
  if (d.notes) o.instructions = { client: [d.notes], company: [`Scanbacks are due within ${S.ws.scanHours} hours of signing.`] };
  const c = clientBy(d.client); if (c) c.ordersMonth++;
  S.orders.unshift(o); S.draft = emptyDraft(); prevReq = new Set(); S.tab = 'active';
  go('#/orders/' + id); toast(`Order <b>${id}</b> placed`, { icon: 'badge' });
}

/* Inline edit */
function startEdit(dd) {
  if (dd.querySelector('input')) return;
  const o = byId(dd.dataset.id), key = dd.dataset.edit, isDate = key === 'date', isTime = key === 'time';
  const cur = isDate ? (o.date || '') : isTime ? to24h(o.time) : (o[key] || '');
  dd.innerHTML = `<input class="input ${['phone', 'sms', 'file'].includes(key) ? 'mono' : ''}" type="${isDate ? 'date' : isTime ? 'time' : key === 'email' || key === 'cc' ? 'email' : 'text'}" value="${esc(cur)}" aria-label="Edit ${esc(key)}">`;
  const inp = dd.querySelector('input'); inp.focus(); if (!isDate && !isTime) inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save) {
      let v = inp.value.trim();
      if (['phone', 'sms'].includes(key) && v) v = fmtPhone(v);
      if (isTime && v) v = to12h(v);
      if (['email', 'cc'].includes(key) && v && !isEmail(v)) { toast('That email address doesn’t look right — nothing was saved', { warn: true }); refreshDetail(); return; }
      if ((o[key] || '') !== v) {
        o[key] = v || (isDate || isTime ? null : '');
        if (isDate || isTime) o.pastDue = !!(sigDate(o) && sigDate(o) < NOW && o.status === 'active' && o.notary);
        const label = dd.closest('.f').querySelector('dt').textContent;
        pushActivity(o, `${label} updated`, ''); refreshDetail(isDate || isTime); toast(`${esc(label)} saved`); return;
      }
    }
    refreshDetail();
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); finish(true); } if (ev.key === 'Escape') { ev.stopPropagation(); finish(false); } });
  inp.addEventListener('blur', () => finish(true));
}

/* Keyboard */
document.addEventListener('keydown', e => {
  const ae = document.activeElement, typing = /INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!AUTH[route().parts[0]]) ($('.palette-wrap') ? closePalette() : openPalette()); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && ae.id === 'msg-in') { e.preventDefault(); const o = byId(route().parts[1]); if (o) sendMsg(o); return; }
  if ($('.palette-wrap')) {
    const items = $$('.pal-item');
    if (e.key === 'Escape') closePalette();
    else if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = Math.min(items.length - 1, palIdx + 1); renderPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = Math.max(0, palIdx - 1); renderPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); const it = items[palIdx]; if (it) palGo(it.dataset.pal); }
    return;
  }
  if (modal) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') { const f = $$('button,input,select,textarea,a[href]', modal.el).filter(x => !x.disabled && x.offsetParent); if (f.length) { const i = f.indexOf(ae); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } } }
    return;
  }
  if (e.key === 'Escape') {
    if (menuEl) { closeMenu(); return; }
    const open = $('.combo.open'); if (open) { open.classList.remove('open'); return; }
    if ($('.drawer-wrap')) { closePeek(); return; }
    const sh = $('.shell'); if (sh) sh.classList.remove('drawer'); return;
  }
  const combo = ae.closest && ae.closest('.combo.open');
  if (combo && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    const opts = $$('.combo-opt', combo); if (!opts.length) return;
    let i = opts.findIndex(x => x.classList.contains('hl'));
    if (e.key === 'Enter') { e.preventDefault(); (opts[i] || opts[0]).click(); return; }
    e.preventDefault(); opts.forEach(x => x.classList.remove('hl')); i = e.key === 'ArrowDown' ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1);
    opts[i].classList.add('hl'); opts[i].scrollIntoView({ block: 'nearest' }); return;
  }
  if (menuEl && ['ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); const its = $$('.mi', menuEl); let i = its.indexOf(ae); i = e.key === 'ArrowDown' ? (i + 1) % its.length : (i - 1 + its.length) % its.length; its[i].focus(); return; }
  if (ae.classList && ae.classList.contains('editable') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startEdit(ae); return; }
  if (ae.matches && ae.matches('.drv') && e.key === 'Enter') { ae.click(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('.drawer-wrap')) {
    if (['ArrowDown', 'j'].includes(e.key)) { e.preventDefault(); peekStep(1); return; }
    if (['ArrowUp', 'k'].includes(e.key)) { e.preventDefault(); peekStep(-1); return; }
    if (e.key === 'o' && peekId) { go('#/orders/' + peekId); return; }
    return;
  }
  const row = ae.closest && ae.closest('tr[data-peek]');
  if (row) {
    const rows = $$('tr[data-peek]'), i = rows.indexOf(row);
    if (e.key === 'ArrowDown' && rows[i + 1]) { e.preventDefault(); rows[i + 1].focus(); return; }
    if (e.key === 'ArrowUp' && rows[i - 1]) { e.preventDefault(); rows[i - 1].focus(); return; }
    if (e.key === 'Enter') { e.preventDefault(); openPeek(row.dataset.peek); return; }
    if (e.key === 'o') { go('#/orders/' + row.dataset.peek); return; }
    if (e.key === 'x') { const cb = row.querySelector('input[type=checkbox]'); cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); setTimeout(() => { const r = $(`tr[data-peek="${row.dataset.peek}"]`); if (r) r.focus(); }, 0); return; }
  }
  if (AUTH[route().parts[0]]) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); go('#/new'); }
  else if (e.key === '/') { e.preventDefault(); openPalette(); }
  else if (e.key === '?') { shortcutsModal(); }
  else if (e.key === 'ArrowDown' && route().parts[0] === 'orders' && !route().parts[1]) { const r = $('tr[data-peek]'); if (r && r.offsetParent) { e.preventDefault(); r.focus(); } }
});
addEventListener('resize', () => { closeMenu(); hideTip(); placeInk(); });
addEventListener('scroll', () => { if (menuEl && menuEl.dataset.key !== 'filters' && Math.abs(scrollY - (+menuEl.dataset.y || 0)) > 24) closeMenu(); }, { passive: true });

/* Boot */
if (!location.hash) location.replace('#/signin');
render(true);

</script>
