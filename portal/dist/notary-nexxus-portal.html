<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notary Nexxus Portal</title>
<meta name="description" content="Notary Nexxus — signing service management portal (design prototype).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>var t='light';try{t=localStorage.getItem('nn-theme')||'light'}catch(e){}document.documentElement.setAttribute('data-theme',t)</script>
<style>
/* =========================================================
   NOTARY NEXXUS — design tokens
   ========================================================= */
:root{
  --font-ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
  /* spacing scale */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-xl:16px;--r-lg:14px;--r:10px;--r-sm:8px;
  --topbar:60px;

  --ink:#2346E0;--ink-strong:#1A36B8;--ink-soft:#EEF2FE;--ink-line:#C7D2FB;
  --btn:#2346E0;--btn-hover:#1B3AC4;
  --night:#0A1029;--night-2:#141C40;--night-line:rgba(255,255,255,.08);
  --night-text:#E7EAF6;--night-text-2:#A3ABCB;--night-text-3:#6C75A3;
  --canvas:#F3F4F6;--surface:#FFFFFF;--surface-2:#F8F9FB;--sunken:#EEF0F3;--hover:#F6F7FA;
  --line:#E4E7EC;--line-strong:#D2D7DF;
  --text:#10131A;--text-2:#4A5163;--text-3:#7A8091;
  --foil:#A57719;--foil-soft:#FBF3E1;
  --red:#C93434;--red-soft:#FCEEEE;--amber:#A4620A;--amber-soft:#FCF3E3;--green:#0F7A55;--green-soft:#E7F5EF;
  --seal-track:#DDE1E8;
  --shadow-sm:0 1px 2px rgba(16,19,26,.05);
  --shadow-md:0 1px 2px rgba(16,19,26,.04),0 8px 24px -8px rgba(16,19,26,.12);
  --shadow-lg:0 2px 6px rgba(16,19,26,.05),0 28px 64px -16px rgba(16,19,26,.28);
  --ring:0 0 0 3px rgba(35,70,224,.2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#7C97FF;--ink-strong:#A6B7FF;--ink-soft:rgba(124,151,255,.12);--ink-line:rgba(124,151,255,.32);
    --btn:#3A5CF0;--btn-hover:#4D6DF6;--night:#070A17;--night-2:#111832;
    --canvas:#0A0C11;--surface:#12151C;--surface-2:#161A22;--sunken:#0E1116;--hover:#1A1E27;
    --line:#232834;--line-strong:#303643;--text:#E8EBF1;--text-2:#A4ABBA;--text-3:#737A8B;
    --foil:#DDB463;--foil-soft:rgba(221,180,99,.12);
    --red:#F27474;--red-soft:rgba(242,116,116,.12);--amber:#E9A548;--amber-soft:rgba(233,165,72,.12);--green:#45C997;--green-soft:rgba(69,201,151,.12);
    --seal-track:#2B313D;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);--shadow-lg:0 30px 70px -16px rgba(0,0,0,.75);
    --ring:0 0 0 3px rgba(124,151,255,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#7C97FF;--ink-strong:#A6B7FF;--ink-soft:rgba(124,151,255,.12);--ink-line:rgba(124,151,255,.32);
  --btn:#3A5CF0;--btn-hover:#4D6DF6;--night:#070A17;--night-2:#111832;
  --canvas:#0A0C11;--surface:#12151C;--surface-2:#161A22;--sunken:#0E1116;--hover:#1A1E27;
  --line:#232834;--line-strong:#303643;--text:#E8EBF1;--text-2:#A4ABBA;--text-3:#737A8B;
  --foil:#DDB463;--foil-soft:rgba(221,180,99,.12);
  --red:#F27474;--red-soft:rgba(242,116,116,.12);--amber:#E9A548;--amber-soft:rgba(233,165,72,.12);--green:#45C997;--green-soft:rgba(69,201,151,.12);
  --seal-track:#2B313D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);--shadow-lg:0 30px 70px -16px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(124,151,255,.28);
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar) + 16px)}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:14px;line-height:1.5;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.no-scroll{overflow:hidden}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .3s ease,border-color .3s ease,color .25s ease,fill .3s ease,stroke .3s ease !important}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:var(--ink-soft);color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-size:.92em;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none !important}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.h1{font-family:var(--font-display);font-weight:500;font-size:38px;line-height:1.05;letter-spacing:-.018em}
.h2{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.lede{color:var(--text-2);margin-top:var(--s2);font-size:14.5px;max-width:720px}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:500;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;text-align:left}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--text-2)}
.link.quiet:hover{color:var(--ink)}
a.name-link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
kbd{font-family:var(--font-mono);font-size:10.5px;padding:2px 5px;border-radius:5px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text-3);line-height:1.2;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:500;font-size:13.5px;line-height:1;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,box-shadow .15s,transform .08s;user-select:none}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn);border-color:transparent;color:#fff;box-shadow:0 1px 2px rgba(16,19,26,.12),inset 0 1px 0 rgba(255,255,255,.16)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-ink{color:var(--ink);border-color:var(--ink-line)}
.btn-ink:hover{background:var(--ink-soft)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{color:var(--red)}
.btn-danger-solid{background:var(--red);border-color:transparent;color:#fff}
.btn-danger-solid:hover{filter:brightness(1.06);background:var(--red)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;gap:6px}
.btn-lg{height:46px;font-size:14.5px;border-radius:11px;padding:0 18px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--text-2);position:relative;flex:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn.xs{width:26px;height:26px;border-radius:7px}
.icon-btn.bordered{border-color:var(--line-strong);background:var(--surface);box-shadow:var(--shadow-sm)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.icon-btn .badge-dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--canvas)}

/* Form controls */
.field{min-width:0}
.label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.label .opt{color:var(--text-3);font-weight:400}
.label .spacer{flex:1}
.star{color:var(--red)}
.input,.select,.textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--text);font-size:14px;transition:border-color .15s,box-shadow .15s,background .15s;appearance:none;-webkit-appearance:none;min-width:0}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.5}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:hover,.select:hover,.textarea:hover{border-color:color-mix(in srgb,var(--line-strong) 55%,var(--text-3))}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--ink);box-shadow:var(--ring)}
.input[disabled],.select[disabled],.input[readonly]{background:var(--sunken);color:var(--text-3);cursor:not-allowed}
.input.sm,.select.sm{height:34px;font-size:13px}
.field.invalid .input,.field.invalid .select,.field.invalid .textarea{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.field-err{display:none;align-items:center;gap:5px;font-size:12px;color:var(--red);margin-top:6px}
.field.invalid .field-err{display:flex}
.help{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.45}
.iw{position:relative}
.iw>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.iw>.input{padding-left:36px}
.iw .suffix{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.sw{position:relative}
.sw>.ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.sw .select{padding-right:34px;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4) 18px}
.span2{grid-column:span 2}
.span-all{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--btn);margin:0;flex:none}
.toggle{position:relative;width:34px;height:20px;flex:none;display:inline-block}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:20px;background:var(--line-strong);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.2,1.2)}
.toggle input:checked+i{background:var(--btn)}
.toggle input:checked+i::after{transform:translateX(14px)}
.toggle input:focus-visible+i{box-shadow:var(--ring)}
.seg-ctl{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--sunken);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg-ctl::-webkit-scrollbar{display:none}
.seg-ctl button{height:30px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:color .15s,background .15s}
.seg-ctl button:hover{color:var(--text)}
.seg-ctl button .n{font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
.seg-ctl button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,19,26,.08),0 0 0 1px var(--line)}
.seg-ctl button.active .n{color:var(--ink)}
.seg-ctl.icons button{width:32px;padding:0;justify-content:center}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--sunken);color:var(--text-2);white-space:nowrap;flex:none}
.chip.ink{background:var(--ink-soft);color:var(--ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.foil{background:var(--foil-soft);color:var(--foil)}
.chip.outline{background:transparent;border:1px solid var(--line-strong)}
.chip.lg{height:26px;padding:0 10px;font-size:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:8px;background:var(--ink-soft);color:var(--ink);font-size:12.5px;font-weight:500;border:1px solid var(--ink-line);white-space:nowrap}
.fchip .k{color:var(--text-2);font-weight:400}
.fchip button{width:20px;height:20px;border-radius:5px;border:0;background:transparent;color:inherit;display:grid;place-items:center}
.fchip button:hover{background:rgba(35,70,224,.12)}
.flag-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;color:var(--text-2);transition:all .15s;white-space:nowrap}
.flag-btn:hover{border-color:var(--text-3);color:var(--text)}
.flag-btn.sm{height:28px;font-size:12px;padding:0 9px}
.flag-btn[aria-pressed="true"]{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 45%,transparent);color:var(--amber)}
.flag-btn.scan[aria-pressed="true"]{background:var(--ink-soft);border-color:var(--ink-line);color:var(--ink)}

/* Avatars */
.av{--h:220;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;flex:none;background:hsl(var(--h) 70% 93%);color:hsl(var(--h) 48% 30%)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.lg{width:40px;height:40px;font-size:13.5px}
.av.xl{width:56px;height:56px;font-size:18px}
.av.sq{border-radius:9px}
.av.xl.sq{border-radius:14px}
:root[data-theme="dark"] .av{background:hsl(var(--h) 32% 20%);color:hsl(var(--h) 75% 82%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 32% 20%);color:hsl(var(--h) 75% 82%)}}
.av-stack{display:flex}
.av-stack .av{box-shadow:0 0 0 2px var(--surface)}
.av-stack .av+.av{margin-left:-6px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);min-width:0}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:56px}
.card-head .spacer{flex:1}
.card-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);flex:none}
.card-title{font-weight:600;font-size:14px;letter-spacing:-.005em;white-space:nowrap}
.card-sub{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-count{font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);padding:1px 7px;border-radius:6px;background:var(--sunken)}
.card-body{padding:var(--s5)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.card.clickable{cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .2s}
.card.clickable:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stack{display:flex;flex-direction:column;gap:var(--s5);min-width:0}

/* =========================================================
   SEAL — signature element
   ========================================================= */
.seal{display:block;flex:none;overflow:visible}
.seal .edge{fill:var(--surface);stroke:var(--line-strong);stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .4s,stroke .4s}
.seal .inner{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.seal .seg{fill:none;stroke:var(--seal-track);stroke-width:10;transition:stroke .4s}
.seal .seg.on{stroke:var(--ink)}
.seal .n{font-family:var(--font-display);font-size:30px;font-weight:500;fill:var(--text);text-anchor:middle}
.seal .of{font-family:var(--font-ui);font-size:9.5px;font-weight:600;letter-spacing:.08em;fill:var(--text-3);text-anchor:middle}
.seal .ck{fill:none;stroke:var(--foil);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.seal.complete .edge{fill:var(--foil-soft);stroke:var(--foil)}
.seal.complete .inner{stroke:color-mix(in srgb,var(--foil) 40%,transparent)}
.seal.complete .seg{stroke:var(--foil)}
.seal.css-draw .seg.on{stroke-dasharray:100;animation:seal-draw .75s cubic-bezier(.3,.7,.2,1) both;animation-delay:var(--d)}
@keyframes seal-draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.on-night .seal .edge{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.18)}
.on-night .seal .inner{stroke:rgba(255,255,255,.08)}
.on-night .seal .seg{stroke:rgba(255,255,255,.1)}
.on-night .seal .seg.on{stroke:#7C97FF}
.on-night .seal .n{fill:#fff}
.on-night .seal .of{fill:var(--night-text-3)}
.on-night .seal.complete .edge{fill:rgba(221,180,99,.1);stroke:#DDB463}
.on-night .seal.complete .seg{stroke:#DDB463}
.q{display:inline-block;width:14px;height:14px;flex:none}
.q path{fill:none;stroke:var(--seal-track);stroke-width:3.2}
.q path.on{stroke:var(--ink)}
.q.complete path{stroke:var(--foil)}

/* Tooltip */
.tip{position:fixed;z-index:600;pointer-events:none;background:var(--night);color:#fff;font-size:12px;line-height:1.5;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-md);max-width:260px;border:1px solid rgba(255,255,255,.06)}
.tip b{font-weight:600}
.tip .ok{color:#45C997}
.tip .no{color:#8F97B8}

/* =========================================================
   AUTH
   ========================================================= */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);background:var(--surface)}
.auth-brand{position:relative;overflow:hidden;background:var(--night);color:var(--night-text);padding:44px 56px;display:flex;flex-direction:column}
.auth-brand::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 520px at 85% 110%,rgba(58,92,240,.32),transparent 60%),radial-gradient(600px 400px at -10% -10%,rgba(124,151,255,.12),transparent 60%);pointer-events:none}
.auth-brand::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 70%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 70%,#000 10%,transparent 70%);pointer-events:none}
.auth-brand>*{position:relative;z-index:1}
.auth-eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--night-text-2)}
.auth-eyebrow .dot{color:#7C97FF;box-shadow:0 0 0 4px rgba(124,151,255,.18)}
.auth-hero{margin-top:auto;max-width:620px}
.auth-h{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,5.2vw,72px);line-height:.98;letter-spacing:-.025em;color:#fff}
.auth-h em{font-style:italic;color:#C9D4FF}
.auth-sub{margin-top:22px;font-size:16px;line-height:1.6;color:var(--night-text-2);max-width:520px}
.auth-demo{margin-top:44px;display:flex;align-items:center;gap:28px;padding:22px 24px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);max-width:520px}
.auth-legend{display:grid;gap:9px;flex:1;min-width:0}
.auth-legend li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--night-text-3);transition:color .35s}
.auth-legend li.on{color:var(--night-text)}
.auth-legend li .q path{stroke:rgba(255,255,255,.14)}
.auth-legend li.on .q path.on{stroke:#7C97FF}
.auth-legend li.on.gold .q path.on{stroke:#DDB463}
.auth-legend .t{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--night-text-3)}
.auth-foot{margin-top:56px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:12.5px;color:var(--night-text-2)}
.auth-foot span{display:inline-flex;align-items:center;gap:7px}
.auth-copy{margin-top:14px;font-size:12px;color:var(--night-text-3)}
.auth-side{position:relative;display:flex;align-items:center;justify-content:center;padding:48px 32px;background:var(--surface)}
.auth-theme{position:absolute;top:20px;right:20px}
#auth-slot{width:100%;max-width:460px}
.auth-form{width:100%}
@media (max-width:600px){.auth-side{padding:72px 20px 40px;align-items:flex-start}.auth-title{margin-top:44px}}
.logo-lockup{display:flex;align-items:center;gap:12px}
.logo-lockup .wm{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;padding-left:12px;border-left:1px solid var(--line-strong);color:var(--text)}
.auth-title{font-family:var(--font-display);font-weight:500;font-size:34px;letter-spacing:-.015em;margin-top:56px;line-height:1.1}
.auth-desc{color:var(--text-2);margin-top:8px}
.btn-google{width:100%;height:44px;margin-top:28px;font-size:14px}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--text-3);text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-form .field+.field{margin-top:16px}
.auth-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 22px}
.auth-note{margin-top:22px;text-align:center;font-size:13px;color:var(--text-2)}
.auth-secure{margin-top:40px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--text-3)}
.auth-done{margin-top:32px;padding:20px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;gap:14px}
.auth-done .ok{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);flex:none}
.auth-done p{font-size:13.5px;color:var(--text-2)}
.auth-done b{color:var(--text)}

/* =========================================================
   SHELL
   ========================================================= */
.shell{--sbw:244px;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.shell.collapsed{--sbw:72px}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px 12px;background:var(--night);color:var(--night-text);z-index:50;overflow:hidden auto;scrollbar-width:none}
:root[data-theme="dark"] .sidebar{border-right:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sidebar{border-right:1px solid var(--line)}}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:0 2px 0 6px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.wordmark{font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;color:#fff}
.sb-btn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--night-text-3);display:grid;place-items:center;flex:none}
.sb-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-new{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;font-weight:500;white-space:nowrap;transition:background .15s}
.sb-new:hover{background:rgba(255,255,255,.11)}
.sb-new kbd{margin-left:auto;background:transparent;border-color:rgba(255,255,255,.16);color:var(--night-text-3)}
.sb-label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--night-text-3);padding:20px 12px 6px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:9px;color:var(--night-text-2);font-weight:500;white-space:nowrap;position:relative;border:0;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.09)}
.sb-item.active::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#7C97FF}
.sb-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--night-text-3)}
.sb-item.active .sb-count{color:var(--night-text-2)}
.sb-bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--night-line);padding-top:10px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:0;background:none;color:inherit;text-align:left;width:100%}
.sb-user:hover{background:rgba(255,255,255,.05)}
.sb-user .who{min-width:0;flex:1}
.sb-user .nm{color:#fff;font-weight:500;font-size:13px}
.sb-user .rl{color:var(--night-text-3);font-size:12px}
.sb-user .av{background:#3A5CF0;color:#fff}
.collapsed .wordmark,.collapsed .sb-item span,.collapsed .sb-new span,.collapsed .sb-new kbd,.collapsed .sb-user .who,.collapsed .sb-user>.ic{display:none}
.collapsed .sb-top{flex-direction:column;gap:12px;padding:0}
.collapsed .sb-item,.collapsed .sb-new{justify-content:center;padding:0}
.collapsed .sb-user{justify-content:center}
.collapsed .sb-label{font-size:0;padding:0;height:1px;background:var(--night-line);margin:14px 10px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar);display:flex;align-items:center;gap:10px;padding:0 32px;background:color-mix(in srgb,var(--canvas) 84%,transparent);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.tb-menu{display:none}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;overflow:hidden}
.crumbs a{white-space:nowrap}
.crumbs a:hover{color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{opacity:.6}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search-trigger{display:flex;align-items:center;gap:10px;height:36px;width:min(340px,32vw);padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-3);font-size:13px;margin-right:6px;transition:border-color .15s,box-shadow .15s}
.search-trigger:hover{border-color:var(--text-3)}
.search-trigger span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{width:100%;max-width:1480px;margin:0 auto;padding:28px 32px 96px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:var(--s6);flex-wrap:wrap}
.page-head>div:first-child{min-width:0;flex:1 1 420px}
.page-head .eyebrow{margin-bottom:10px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:var(--s4)}
.back:hover{color:var(--ink)}
.scrim{display:none}

/* =========================================================
   ORDERS
   ========================================================= */
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.3fr);overflow:hidden}
.kpi{position:relative;padding:16px 20px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.kpi-label{font-size:12.5px;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.kpi-label .per{color:var(--text-3);font-weight:400}
.kpi-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.kpi-value{font-family:var(--font-display);font-size:38px;line-height:1;font-weight:400;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
.spark{display:block;width:84px;height:32px;overflow:visible;flex:none}
.spark path.l{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark path.a{fill:var(--ink);opacity:.08}
.spark circle{fill:var(--ink)}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);white-space:nowrap;margin-top:12px}
.delta{font-family:var(--font-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:5px;background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.flat{background:var(--sunken);color:var(--text-3)}
.fin{padding:16px 20px;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.fin-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fin-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.fin-stats .k{font-size:11.5px;color:var(--text-3)}
.fin-stats .v{font-family:var(--font-mono);font-size:13px;font-weight:500}
.margin{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;font-size:12px;color:var(--text-3)}
.margin .bar{flex:1;height:6px;border-radius:6px;background:var(--sunken);overflow:hidden;display:flex;gap:2px}
.margin .bar i{display:block;height:100%}
.margin .bar .p{background:var(--text-3);opacity:.35;border-radius:6px 0 0 6px}
.margin .bar .g{background:var(--green);border-radius:0 6px 6px 0}
.ov-wrap{overflow:hidden}

.band{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s5);margin:var(--s5) 0}
.alert-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px}
.atile{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-width:0;transition:border-color .15s,box-shadow .2s,transform .2s,background .15s;color:inherit}
.atile:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.atile.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:var(--ink-soft)}
.atile .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);flex:none}
.atile .tx{min-width:0;flex:1}
.atile .n{font-family:var(--font-display);font-size:28px;line-height:1;font-variant-numeric:lining-nums}
.atile .l{font-weight:500;font-size:13px;margin-top:6px}
.atile .s{font-size:11.5px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono)}
.atile .go{color:var(--text-3);opacity:0;transform:translateX(-4px);transition:all .2s}
.atile:hover .go,.atile.active .go{opacity:1;transform:none}
.atile.active .go{color:var(--ink)}
.atile[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}
.atile[disabled] .ci{background:var(--sunken);color:var(--text-3)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--red);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--red);opacity:0;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}

.agenda{padding:6px 20px 10px}
.ag{display:grid;grid-template-columns:62px 14px minmax(0,1fr) auto;align-items:center;gap:0 12px;padding:9px 6px;margin:0 -6px;border-radius:10px;cursor:pointer;transition:background .15s;width:calc(100% + 12px);border:0;background:none;text-align:left;color:inherit}
.ag:hover{background:var(--hover)}
.ag-time{font-family:var(--font-mono);font-size:12px;color:var(--text-2);text-align:right;white-space:nowrap}
.ag-rail{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.ag-rail::before{content:"";position:absolute;top:-9px;bottom:-9px;left:50%;width:1px;background:var(--line)}
.ag:first-child .ag-rail::before{top:50%}
.ag:last-child .ag-rail::before{bottom:50%}
.ag-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);position:relative;z-index:1}
.ag.done .ag-dot{background:var(--foil);border-color:var(--foil)}
.ag.late .ag-dot{border-color:var(--red);background:var(--red)}
.ag.next .ag-dot{border-color:var(--ink);background:var(--ink);box-shadow:0 0 0 4px var(--ink-soft)}
.ag-main{min-width:0}
.ag-main .nm{font-weight:500;font-size:13.5px}
.ag-main .mt{font-size:12px;color:var(--text-3)}
.ag-now{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:0 12px;align-items:center;height:18px;font-size:11px;font-weight:600;color:var(--red);font-family:var(--font-mono)}
.ag-now span:first-child{text-align:right}
.ag-now .nd{width:7px;height:7px;border-radius:50%;background:var(--red);justify-self:center}
.ag-now .ln{height:1px;background:linear-gradient(90deg,var(--red),transparent)}
.ag-empty{padding:24px 0;text-align:center;color:var(--text-3);font-size:13px}

.orders-card{scroll-margin-top:calc(var(--topbar) + 12px)}
.toolbar{position:sticky;top:var(--topbar);z-index:12;display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0}
.toolbar .search{width:240px}
.toolbar .search .input{height:34px;font-size:13px}
.tb-spacer{flex:1}
.filter-count{font-family:var(--font-mono);font-size:10.5px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:var(--btn);color:#fff;display:grid;place-items:center}
.active-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.active-filters .lbl{font-size:12px;color:var(--text-3);margin-right:2px}

.table-wrap{overflow-x:auto;scrollbar-width:thin}
table.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;height:40px}
.dt th.r,.dt td.r{text-align:right}
.dt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:0}
.dt th:first-child,.dt td:first-child{padding-left:20px}
.dt th:last-child,.dt td:last-child{padding-right:20px}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr{transition:background .12s}
.dt tbody tr.clickable{cursor:pointer}
.dt tbody tr:hover>td{background:var(--hover)}
.dt tbody tr.selected>td{background:var(--ink-soft)}
.dt tbody tr.peeked>td{background:var(--ink-soft)}
.dt tbody tr.peeked>td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.dt tbody tr:focus-visible{outline:none}
.dt tbody tr:focus-visible>td{background:var(--hover)}
.dt tbody tr:focus-visible>td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.th-sort{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.th-sort:hover{color:var(--text)}
.th-sort .ic{opacity:.35}
.th-sort.on{color:var(--text)}
.th-sort.on .ic{opacity:1;color:var(--ink)}
.dt .cb{width:44px}
.dt .cb input{width:15px;height:15px;accent-color:var(--btn);margin:0;display:block}
table.orders{table-layout:fixed;min-width:1060px}
.orders col.c-cb{width:44px}.orders col.c-order{width:182px}.orders col.c-sign{width:150px}.orders col.c-next{width:184px}
.ord-line{display:flex;align-items:center;gap:6px;min-width:0}
.sg-date{overflow:hidden}
.rel-chip{font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
.rel-chip.late{background:var(--red-soft);color:var(--red)}
.orders td{height:76px}
.orders td.cb,.orders th.cb{position:sticky;left:0;z-index:2;background:var(--surface)}
.orders th.cb{background:var(--surface-2)}
.orders td.c-order,.orders th.c-order{position:sticky;left:44px;z-index:2;background:var(--surface)}
.orders th.c-order{background:var(--surface-2)}
.orders td.c-order{box-shadow:inset -1px 0 0 transparent}
.table-wrap.scrolled .orders td.c-order,.table-wrap.scrolled .orders th.c-order{box-shadow:6px 0 8px -6px rgba(16,19,26,.18)}
.orders tr.grp td{height:auto;padding:8px 20px;background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);position:static}
.orders tr.grp:hover td{background:var(--surface-2)}
.orders tr.grp .n{font-family:var(--font-mono);letter-spacing:0;margin-left:6px}
.oc{display:flex;align-items:center;gap:12px;min-width:0}
.oc-tx{min-width:0}
.ord-no{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-weight:600;font-size:13.5px;letter-spacing:-.01em}
a.ord-no:hover{color:var(--ink)}
.ord-meta{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:11.5px;color:var(--text-3);font-family:var(--font-mono);white-space:nowrap}
.ord-meta span{display:inline-flex;align-items:center;gap:3px}
.ord-meta .has{color:var(--text-2)}
.ord-meta .unread{color:var(--ink);font-weight:600}
.prog-s{font-size:11.5px;white-space:nowrap;color:var(--text-3);margin-top:2px}
.prog-s.need{color:var(--red);font-weight:500}
.prog-s.done{color:var(--foil);font-weight:500}
.flag-ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);flex:none}
.flag-ic.scan{background:var(--ink-soft);color:var(--ink)}
.cell-1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2{font-size:12px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-2.mono{font-size:11.5px}
.sg-date{font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sg-date.today{color:var(--ink)}
.sg-date.warn{color:var(--amber)}
.sg-time{font-size:12px;color:var(--text-3);white-space:nowrap;margin-top:2px}
.sg-time.tbd{color:var(--amber);font-style:italic}
.sg-time .tz{font-family:var(--font-mono);font-size:10.5px}
.sg-time .rel{color:var(--ink);font-weight:500}
.sg-time .rel.late{color:var(--red)}
.loc-type{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.tm{display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.75;min-width:0}
.tm>.ic{color:var(--text-3)}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tm-none{color:var(--text-3);font-style:italic}
.tm-pending{color:var(--amber)}
.row-act{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.table-foot .keys{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.order-cards{display:none}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;padding:16px;overflow-x:auto;background:var(--surface-2);scroll-snap-type:x proximity}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:0;scroll-snap-align:start}
.bcol-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:4px 4px 2px}
.bcol-head .n{font-family:var(--font-mono);font-size:11px;color:var(--text-3);font-weight:500;margin-left:auto}
.bcol-desc{font-size:11.5px;color:var(--text-3);padding:0 4px 4px;margin-top:-6px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .2s,transform .2s;text-align:left;color:inherit;width:100%}
.bcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.bcard.peeked{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.bcard-top{display:flex;align-items:center;gap:10px;min-width:0}
.bcard-top .r{margin-left:auto;text-align:right}
.bcard-mid{min-width:0}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.bempty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:18px 12px;text-align:center;font-size:12.5px;color:var(--text-3)}

/* Empty */
.empty{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center}
.empty-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--sunken);color:var(--text-3);margin-bottom:16px}
.empty h3{font-size:15px;font-weight:600}
.empty p{color:var(--text-2);margin-top:6px;max-width:400px;font-size:13.5px}
.empty .btn{margin-top:18px}

/* Bulk bar */
.bulk{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--night);color:#fff;box-shadow:var(--shadow-lg)}
.bulk .n{font-weight:600;font-size:13px;margin-right:8px;white-space:nowrap}
.bulk .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.bulk .btn:hover{background:rgba(255,255,255,.14)}
.bulk .btn.del{color:#FF9C9C}
.bulk .x{color:var(--night-text-2)}
.bulk .x:hover{background:rgba(255,255,255,.08);color:#fff}

/* =========================================================
   ORDER DETAIL
   ========================================================= */
.oh{overflow:hidden}
.oh-main{display:flex;align-items:center;gap:22px;padding:22px 24px}
.oh-title{min-width:0;flex:1}
.oh-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.oh-row .h1{font-size:34px}
.status-pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 11px;border-radius:999px;border:1px solid var(--ink-line);background:var(--ink-soft);color:var(--ink);font-size:12.5px;font-weight:600}
.status-pill.hold{border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft);color:var(--amber)}
.status-pill.completed{border-color:color-mix(in srgb,var(--foil) 45%,transparent);background:var(--foil-soft);color:var(--foil)}
.status-pill.cancelled,.status-pill.deleted{border-color:var(--line-strong);background:var(--sunken);color:var(--text-2)}
.oh-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--text-2)}
.oh-meta>span,.oh-meta>a{display:inline-flex;align-items:center;gap:6px;min-width:0}
.oh-meta .ic{color:var(--text-3)}
.oh-actions{display:flex;gap:8px;align-self:flex-start;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface-2)}
.step{padding:14px 20px;border-right:1px solid var(--line);min-width:0}
.step:last-child{border-right:0}
.step-top{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.step-top .st{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.st.ok{color:var(--green)}.st.need{color:var(--red)}.st.wait{color:var(--text-3)}
.step-val{margin-top:6px;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-val.none{color:var(--text-3);font-weight:400;font-style:italic}
.step .link{margin-top:4px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:var(--s5);margin-top:var(--s5);align-items:start}
.hint{font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fgroup{padding:0 0 20px}
.fgroup+.fgroup{border-top:1px solid var(--line);padding-top:20px}
.fgroup:last-child{padding-bottom:0}
.fgroup-title{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fgroup-title .link{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}
.f{min-width:0}
.f dt{font-size:12px;color:var(--text-3);margin-bottom:3px}
.f dd{font-size:14px;font-weight:500;min-height:26px;display:flex;align-items:center;gap:6px;min-width:0}
.f dd .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.f dd.empty-v{color:var(--text-3);font-weight:400}
.editable{cursor:text;border-radius:6px;margin:-2px -6px;padding:2px 6px;transition:background .12s,box-shadow .12s}
.editable:hover,.editable:focus-visible{background:var(--hover);box-shadow:0 0 0 1px var(--line);outline:none}
.editable .pen{opacity:0;color:var(--text-3);transition:opacity .12s;margin-left:auto}
.editable:hover .pen,.editable:focus-visible .pen{opacity:1}
.f dd .input{height:32px;font-size:13.5px;padding:0 8px}
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:stretch}
.loc-main{min-width:0}
.loc-main .a1{font-weight:500;font-size:14.5px}
.loc-main .a2{color:var(--text-2);margin-top:2px}
.loc-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.map{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sunken);min-height:128px}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .road{stroke:var(--surface);fill:none}
.map .road2{stroke:var(--line-strong);fill:none;opacity:.6}
.map .park{fill:var(--green-soft)}
.map .blk{fill:var(--line);opacity:.55}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:var(--btn);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.pin-ring{position:absolute;left:50%;top:50%;width:26px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(35,70,224,.25)}
.warn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.docs li{display:flex;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.docs li:last-child{border-bottom:0}
.doc-ic{width:38px;height:46px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface-2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--text-2);flex:none;position:relative}
.doc-ic::before{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;background:linear-gradient(225deg,var(--canvas) 50%,var(--line-strong) 50%);border-bottom-left-radius:3px}
.doc-ic.pdf{color:var(--red)}.doc-ic.img{color:var(--ink)}
.doc-main{flex:1;min-width:0}
.doc-name{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;max-width:100%;display:block}
button.doc-name:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.doc-meta{font-size:12px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocr{margin-top:8px;display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.ocr .ic{color:var(--ink);margin-top:2px}
.ocr b{color:var(--text);font-weight:600}
.ocr.pending{background:transparent;border-style:dashed}
.ocr.reading{color:var(--text-3)}
.ocr .bar{display:block;flex:1;height:4px;border-radius:4px;background:var(--sunken);overflow:hidden;margin-top:8px;position:relative}
.ocr .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--ink);border-radius:4px;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.doc-actions{display:flex;gap:2px}
.dropzone{margin:14px 20px 20px;border:1.5px dashed var(--line-strong);border-radius:12px;padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--text-2);font-size:13px;text-align:left;transition:border-color .15s,background .15s;background:transparent;width:calc(100% - 40px)}
.dropzone:hover,.dropzone.over{border-color:var(--ink);background:var(--ink-soft)}
.dropzone .dz-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);flex:none}
.dropzone b{color:var(--ink);font-weight:500}
.dropzone .sm{font-size:12px;color:var(--text-3)}
.thread{padding:6px 20px}
.msg{display:flex;gap:12px;padding:12px 0}
.msg+.msg{border-top:1px solid var(--line)}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.msg-head b{font-weight:600;font-size:13px}
.msg-head .t{color:var(--text-3);margin-left:auto;font-size:12px}
.msg-body{margin-top:4px;color:var(--text-2);font-size:13.5px;overflow-wrap:anywhere}
.composer{margin:4px 20px 20px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--ink);box-shadow:var(--ring)}
.composer textarea{width:100%;border:0;background:transparent;resize:none;min-height:56px;padding:12px 14px 4px;font-size:13.5px;outline:none}
.composer-row{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 10px}
.composer-row .sw .select{height:30px;font-size:12.5px;border-color:transparent;background:var(--sunken);padding-left:10px}
.composer-row .spacer{flex:1}
.instr{display:grid;grid-template-columns:1fr 1fr}
.instr>div{padding:16px 20px;min-width:0}
.instr>div+div{border-left:1px solid var(--line)}
.instr .from{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.instr p{font-size:13.5px;color:var(--text-2)}
.instr p+p{margin-top:8px}
.np-sec{padding:16px 20px}
.np-sec+.np-sec{border-top:1px solid var(--line)}
.np-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sugg{margin-top:8px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:var(--surface);text-align:left;border-bottom:1px solid var(--line);transition:background .12s}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--hover)}
.sugg button.picked{background:var(--ink-soft)}
.sugg .nm{font-weight:500;font-size:13px}
.sugg .mt{font-size:11.5px;color:var(--text-3)}
.sugg .rt{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--text-2);text-align:right}
.sugg .pk{color:var(--ink)}
.np-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.np-help{font-size:12px;color:var(--text-3);margin-top:10px;line-height:1.45}
.inv{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.inv+.inv{margin-top:10px}
.inv-top{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:12px;color:var(--text-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.inv-body{padding:12px}
.inv-who{display:flex;align-items:center;gap:10px;min-width:0}
.inv-who .nm{font-weight:600}
.inv-pay{margin-left:auto;text-align:right;flex:none}
.inv-pay .v{font-family:var(--font-display);font-size:22px;font-weight:500;line-height:1;font-variant-numeric:lining-nums}
.inv-pay .l{font-size:11px;color:var(--text-3)}
.receipts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--text-2)}
.receipts span{display:inline-flex;align-items:center;gap:5px}
.receipts .ic{color:var(--green)}
.inv-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.hist{margin-top:12px}
.hist summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;color:var(--text-2);padding:4px 0}
.hist summary::-webkit-details-marker{display:none}
.hist summary .link .ic{transition:transform .2s}
.hist[open] summary .link .ic{transform:rotate(180deg)}
.hist-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line);color:var(--text-2)}
.hist-row .t{margin-left:auto;color:var(--text-3);font-size:11.5px;white-space:nowrap}
.assigned{display:flex;align-items:center;gap:12px;min-width:0}
.assigned .nm{font-weight:600;font-size:14px}
.contact-row{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;color:var(--text-2)}
.contact-row>span,.contact-row>a{display:flex;align-items:center;gap:8px;min-width:0}
.contact-row .ic{color:var(--text-3)}
.bill{padding:16px 20px}
.bill-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding:5px 0;color:var(--text-2)}
.bill-row .v{font-family:var(--font-mono);font-size:12.5px;color:var(--text);white-space:nowrap}
.bill-row.sub .v{color:var(--text-3)}
.bill-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--text);font-weight:600}
.bill-row.total .v{font-family:var(--font-display);font-size:24px;font-weight:500;font-variant-numeric:lining-nums}
.bill-bar{display:flex;gap:2px;height:8px;border-radius:8px;overflow:hidden;margin:14px 0 8px;background:var(--sunken)}
.bill-bar i{display:block;height:100%}
.bill-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.bill-legend span{display:inline-flex;align-items:center;gap:6px}
.bill-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.timeline{padding:14px 20px 16px}
.tl{position:relative;display:flex;gap:12px;padding-bottom:16px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);margin-top:4px;flex:none;position:relative;z-index:1}
.tl-dot.ink{border-color:var(--ink);background:var(--ink)}
.tl-dot.green{border-color:var(--green);background:var(--green)}
.tl-dot.amber{border-color:var(--amber)}
.tl-dot.foil{border-color:var(--foil);background:var(--foil)}
.tl-txt{font-size:13px;color:var(--text-2)}
.tl-txt b{color:var(--text);font-weight:600}
.tl-t{font-size:11.5px;color:var(--text-3);margin-top:1px}
.audit{margin-top:var(--s5)}
.audit>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 20px}
.audit>summary::-webkit-details-marker{display:none}
.audit>summary .chev{transition:transform .2s;color:var(--text-3);margin-left:auto}
.audit[open]>summary{border-bottom:1px solid var(--line)}
.audit[open]>summary .chev{transform:rotate(180deg)}

/* =========================================================
   NEW ORDER
   ========================================================= */
.no-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--s5);align-items:start}
.sec{scroll-margin-top:calc(var(--topbar) + 16px)}
.sec-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sec-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--ink-soft);color:var(--ink);flex:none;transition:background .3s,color .3s}
.sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sec-head p{font-size:12.5px;color:var(--text-3)}
.sec-head .st{margin-left:auto}
.sec-body{padding:20px}
.sec-done .sec-ic{background:var(--green-soft);color:var(--green)}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;max-height:280px;overflow:auto}
.combo.open .combo-list{display:block}
.combo-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;min-width:0}
.combo-opt:hover,.combo-opt.hl{background:var(--hover)}
.combo-opt .nm{font-weight:500;font-size:13.5px}
.combo-opt .mt{font-size:12px;color:var(--text-3)}
.combo-opt .r{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.flags{display:flex;gap:8px;flex-wrap:wrap}
.sum{position:sticky;top:calc(var(--topbar) + 18px);display:flex;flex-direction:column;gap:14px}
.sum-card{background:var(--night);color:var(--night-text);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.04)}
.sum-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.sum-head .t{font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
.sum-head .chip{background:rgba(255,255,255,.08);color:var(--night-text-2)}
.sum-seal{display:flex;align-items:center;gap:16px;padding:18px}
.sum-seal .t{font-family:var(--font-display);font-size:20px;color:#fff;line-height:1.15}
.sum-seal .s{font-size:12px;color:var(--night-text-3);margin-top:4px;line-height:1.45}
.sum-list{padding:0 18px}
.sum-list>div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--night-line);font-size:13px}
.sum-list dt{color:var(--night-text-3);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.sum-list dd{color:#fff;min-width:0;overflow-wrap:anywhere}
.sum-list dd.none{color:var(--night-text-3)}
.sum-list dd .s{display:block;color:var(--night-text-2);font-size:12px}
.req{padding:14px 18px;border-top:1px solid var(--night-line);background:rgba(255,255,255,.025)}
.req-head{display:flex;justify-content:space-between;font-size:12px;color:var(--night-text-2);margin-bottom:8px}
.req-head b{color:#fff;font-weight:600}
.req-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.req-bar i{display:block;height:100%;background:#7C97FF;border-radius:4px;transition:width .35s cubic-bezier(.2,.7,.2,1),background .3s}
.req-bar.full i{background:#45C997}
.req ul{margin-top:12px;display:grid;gap:6px}
.req li button{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--night-text-3);border:0;background:none;padding:0;width:100%;text-align:left}
.req li button:hover{color:var(--night-text)}
.req .bx{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.req li.ok button{color:var(--night-text)}
.req li.ok .bx{background:#45C997;border-color:#45C997;color:#0A1029}
.sum-cta{padding:16px 18px 18px}
.sum-cta .btn-primary{background:#3A5CF0}
.sum-cta .btn-primary:hover{background:#4D6DF6}
.sum-cta .btn[disabled]{opacity:1;background:rgba(255,255,255,.08);color:var(--night-text-3);box-shadow:none}
.fine{font-size:11.5px;color:var(--night-text-3);text-align:center;margin-top:10px;line-height:1.45}
.no-mobile-bar{display:none}

/* =========================================================
   DIRECTORY / PROFILES
   ========================================================= */
.dir-tools{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dir-tools .search{width:280px}
.dir-tools .input{height:34px;font-size:13px}
.co{display:flex;align-items:center;gap:12px;min-width:0}
.co-tx{min-width:0}
.money{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dir-table{table-layout:fixed;min-width:820px}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ncard{padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;color:inherit}
.ncard-top{display:flex;align-items:center;gap:12px;min-width:0}
.ncard-top .tx{min-width:0;flex:1}
.ncard-top .nm{font-weight:600;font-size:14.5px}
.ncard-top .ct{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:5px;min-width:0}
.ncard-top .chip{align-self:flex-start}
.nstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nstats>div{padding:10px 12px;min-width:0}
.nstats>div+div{border-left:1px solid var(--line)}
.nstats .k{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.nstats .v{font-family:var(--font-display);font-size:20px;font-weight:500;margin-top:2px;font-variant-numeric:lining-nums;white-space:nowrap}
.nstats .v.sm{font-family:var(--font-ui);font-size:13px;font-weight:500;margin-top:5px;overflow:hidden;text-overflow:ellipsis}
.nmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--text-2);min-width:0}
.nmeta .langs{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.summary-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:var(--s4)}
.drv{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.drv:hover{background:var(--hover)}
.drv:last-child{border-bottom:0}
.drv.off .drv-main{opacity:.6}
.drv-main{min-width:0;flex:1}
.drv .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.drv .mt{display:flex;gap:6px 14px;font-size:12.5px;color:var(--text-3);margin-top:2px;flex-wrap:wrap}
.drv .mt span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.drv .r{display:flex;align-items:center;gap:8px;flex:none}
.truck{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);flex:none}
.profile-head{display:flex;align-items:center;gap:18px;padding:22px 24px;flex-wrap:wrap}
.profile-head .tx{min-width:0;flex:1 1 280px}
.profile-head .h1{font-size:32px}
.profile-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--text-2)}
.profile-meta span{display:inline-flex;align-items:center;gap:6px}
.profile-meta .ic{color:var(--text-3)}
.stat-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface-2)}
.stat-strip>div{padding:14px 20px;border-right:1px solid var(--line);min-width:0}
.stat-strip>div:last-child{border-right:0}
.stat-strip .k{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.stat-strip .v{font-family:var(--font-display);font-size:24px;margin-top:2px;font-variant-numeric:lining-nums;white-space:nowrap}
.stat-strip .v.sm{font-family:var(--font-ui);font-size:14px;font-weight:500;margin-top:6px}
.kv{display:grid;gap:12px;padding:16px 20px}
.kv>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;font-size:13px;align-items:baseline}
.kv dt{color:var(--text-3)}
.kv dd{color:var(--text);overflow-wrap:anywhere}
.people li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.people .tx{min-width:0;flex:1}
.people .nm{font-weight:500}
.people .mt{font-size:12px;color:var(--text-3)}
.price-row{display:flex;align-items:center;justify-content:space-between;padding:9px 20px;border-bottom:1px solid var(--line);font-size:13px}
.price-row:last-child{border-bottom:0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days span{width:34px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:500;background:var(--sunken);color:var(--text-3)}
.days span.on{background:var(--ink-soft);color:var(--ink)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid var(--ink-line);background:var(--ink-soft);color:var(--text);font-size:13px;margin-bottom:var(--s5);flex-wrap:wrap}
.banner .ic{color:var(--ink)}
.banner.amber{border-color:color-mix(in srgb,var(--amber) 35%,transparent);background:var(--amber-soft)}
.banner.amber .ic{color:var(--amber)}
.banner .tx{flex:1;min-width:200px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--s5);margin-top:var(--s5);align-items:start}

/* Forms pages */
.form-page{max-width:760px}
.form-card .sec-body+.sec-head{border-top:1px solid var(--line)}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio-card{display:flex;gap:12px;padding:14px;border:1px solid var(--line-strong);border-radius:12px;cursor:pointer;transition:all .15s;background:var(--surface)}
.radio-card:hover{border-color:var(--text-3)}
.radio-card input{margin:3px 0 0;accent-color:var(--btn);width:16px;height:16px;flex:none}
.radio-card .t{font-weight:600;font-size:13.5px}
.radio-card .d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.radio-card:has(input:checked){border-color:var(--ink);background:var(--ink-soft);box-shadow:0 0 0 1px var(--ink) inset}
.form-foot{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.form-foot p{font-size:12.5px;color:var(--text-3);flex:1;min-width:220px}

/* Reports */
.rep-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s5)}
.cols{position:relative;display:flex;align-items:flex-end;gap:2px;height:200px;padding:0 0 0 36px}
.cols .gl{position:absolute;left:36px;right:0;height:1px;background:var(--line)}
.cols .gl span{position:absolute;left:-36px;top:-8px;width:28px;text-align:right;font-size:11px;color:var(--text-3);font-family:var(--font-mono)}
.cols .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;position:relative;z-index:1;cursor:default}
.cols .col i{display:block;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;transform-origin:bottom;opacity:.85;transition:opacity .15s}
.cols .col:hover i{opacity:1}
.cols .col.today i{background:var(--ink-strong);opacity:1}
.cols-x{display:flex;gap:2px;padding-left:36px;margin-top:8px}
.cols-x span{flex:1;text-align:center;font-size:10.5px;color:var(--text-3);font-family:var(--font-mono);min-width:0}
.hbars{display:grid;gap:12px;padding:18px 20px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 80px 48px;align-items:center;gap:12px;font-size:13px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--sunken);border-radius:0 4px 4px 0;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--ink);border-radius:0 4px 4px 0;transform-origin:left}
.hb .vl{font-family:var(--font-mono);font-size:12.5px;text-align:right}
.hb .sh{font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);text-align:right}
.chart-pad{padding:20px}

/* Settings */
.set-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--s6);align-items:start}
.set-nav{position:sticky;top:calc(var(--topbar) + 20px);display:flex;flex-direction:column;gap:2px}
.set-nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:9px;color:var(--text-2);font-weight:500;font-size:13.5px;white-space:nowrap}
.set-nav a:hover{background:var(--hover);color:var(--text)}
.set-nav a.active{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line),var(--shadow-sm)}
.set-nav a.active .ic{color:var(--ink)}
.set-row{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .tx{flex:1;min-width:0}
.set-row .t{font-weight:500;font-size:13.5px}
.set-row .d{font-size:12.5px;color:var(--text-3);margin-top:2px}
.matrix th.c,.matrix td.c{text-align:center;width:90px}
.matrix td .toggle{margin:0 auto;display:block}

/* =========================================================
   OVERLAYS
   ========================================================= */
.menu{position:fixed;z-index:400;min-width:210px;max-width:min(360px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;max-height:min(440px,calc(100vh - 24px));overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:13px;color:var(--text);white-space:nowrap;min-width:0}
.mi>span:not(.r){overflow:hidden;text-overflow:ellipsis}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi .ic{color:var(--text-3)}
.mi.danger{color:var(--red)}
.mi.danger .ic{color:var(--red)}
.mi .r{margin-left:auto;color:var(--text-3);font-size:12px;padding-left:12px}
.mi.on .r{color:var(--ink)}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}
.menu-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
.menu.wide{width:360px}
.notif{display:flex;gap:10px;padding:10px;border-radius:8px}
.notif:hover{background:var(--hover)}
.notif .ni{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.notif .tx{font-size:13px;color:var(--text-2);line-height:1.4;white-space:normal}
.notif .tx b{color:var(--text);font-weight:600}
.notif .tm{font-size:11.5px;color:var(--text-3);margin-top:2px;display:block}
.notif.unread .tx::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:middle}
.palette-wrap,.modal-wrap{position:fixed;inset:0;z-index:300;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;overflow:auto}
.palette-scrim,.modal-scrim{position:fixed;inset:0;background:rgba(8,10,20,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.palette{position:relative;width:min(640px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;height:56px;border:0;background:transparent;font-size:16px;outline:none;min-width:0}
.pal-res{max-height:min(420px,56vh);overflow:auto;padding:6px}
.pal-group{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 4px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:9px;text-align:left;min-width:0}
.pal-item.hl{background:var(--hover)}
.pal-item .pi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);flex:none}
.pal-item .tx{min-width:0;flex:1}
.pal-item .nm{font-size:13.5px;font-weight:500}
.pal-item .mt{font-size:12px;color:var(--text-3)}
.pal-item .r{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.pal-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3);background:var(--surface-2)}
.pal-foot span{display:inline-flex;align-items:center;gap:6px}
.modal{position:relative;width:min(520px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);margin-bottom:24px}
.modal.lg{width:min(820px,100%)}
.modal.sm{width:min(420px,100%)}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 0}
.modal-head h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal-head p{color:var(--text-2);font-size:13px;margin-top:4px}
.modal-body{padding:20px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-xl) var(--r-xl);flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.drawer-wrap{position:fixed;inset:0;z-index:250}
.drawer-scrim{position:absolute;inset:0;background:rgba(8,10,20,.3)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.dr-head{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.dr-head .pos{font-size:12px;color:var(--text-3);font-family:var(--font-mono);margin:0 6px}
.dr-head .spacer{flex:1}
.dr-body{flex:1;overflow:auto;padding:20px}
.dr-hero{display:flex;align-items:center;gap:16px}
.dr-hero .tx{min-width:0;flex:1}
.dr-hero h2{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:1.1;margin-top:4px}
.dr-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dr-steps{margin-top:20px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dr-step{display:grid;grid-template-columns:16px 92px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.dr-step:last-child{border-bottom:0}
.dr-step .k{color:var(--text-3);font-size:12px}
.dr-step .v{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-step .v.none{color:var(--text-3);font-weight:400;font-style:italic}
.dr-sec{margin-top:20px}
.dr-sec h3{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.dr-kv{display:grid;gap:8px}
.dr-kv>div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:13px}
.dr-kv dt{color:var(--text-3)}
.dr-kv dd{min-width:0;overflow-wrap:anywhere}
.dr-files{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-files a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;transition:border-color .15s,background .15s}
.dr-files a:hover{border-color:var(--line-strong);background:var(--hover)}
.dr-files b{font-family:var(--font-display);font-size:20px;font-weight:500}
.dr-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface-2)}
.dr-foot .btn{flex:1}
#toasts{position:fixed;right:20px;bottom:20px;z-index:700;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;min-width:260px;max-width:440px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--night);color:#fff;box-shadow:var(--shadow-lg);font-size:13px;border:1px solid rgba(255,255,255,.06)}
.toast>.ic{color:#45C997}
.toast.warn>.ic{color:#E9A548}
.toast .tx{flex:1;min-width:0}
.toast button{background:rgba(255,255,255,.1);border:0;color:#fff;height:28px;padding:0 10px;border-radius:7px;font-weight:500;font-size:12.5px;white-space:nowrap}
.toast button:hover{background:rgba(255,255,255,.18)}
.toast.css-in{animation:toast-in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Document + invoice previews */
.dp{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.paper-wrap{background:var(--sunken);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.paper{background:#fff;color:#1d2026;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 14px 32px -12px rgba(0,0,0,.28);width:100%;max-width:420px;aspect-ratio:8.5/11;padding:9% 10%;position:relative;overflow:hidden;font-family:Georgia,serif}
.paper .ph{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.paper .ps{font-size:9px;text-align:center;color:#666;margin-top:4px;font-family:var(--font-ui)}
.paper .ln{height:5px;background:#E6E7EB;border-radius:3px;margin:7px 0}
.paper .sig{position:relative;margin-top:18px;border-bottom:1px solid #2a2d35;height:22px;width:62%}
.paper .sig span{position:absolute;left:0;bottom:-14px;font-size:7.5px;color:#666;font-family:var(--font-ui);white-space:nowrap}
.sign-flag{position:absolute;right:calc(100% + 6px);bottom:-6px;height:16px;padding:0 10px 0 6px;background:#FFD84D;color:#5a4300;font:700 7px/16px var(--font-ui);letter-spacing:.08em;white-space:nowrap;clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%)}
.paper .fill{background:rgba(35,70,224,.14);border-radius:2px;padding:0 2px;color:#1A36B8;font-family:var(--font-ui);font-size:8px;font-weight:600}
.pager{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.find-list{display:grid;gap:8px}
.find-list li{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);align-items:flex-start}
.find-list .ic{color:var(--green);margin-top:2px}
.find-list .ic.warn{color:var(--amber)}
.invoice{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--surface)}
.inv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.inv-no{font-family:var(--font-display);font-size:26px}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0;font-size:13px}
.inv-parties .k{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.inv-total{display:flex;justify-content:flex-end;gap:32px;align-items:baseline;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.inv-total .v{font-family:var(--font-display);font-size:28px}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:1360px){
  .overview{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi:nth-child(4){border-right:0}
  .fin{grid-column:1/-1;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:12px 32px;align-items:center}
  .fin-stats{margin-top:0}
  .margin{margin-top:0;padding-top:0}
}
@media (max-width:1180px){
  .band{grid-template-columns:minmax(0,1fr)}
  .detail-grid,.no-grid,.two-col{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat-strip>div:nth-child(3){border-right:0}
  .stat-strip>div:nth-child(n+4){border-top:1px solid var(--line)}
  .rep-grid{grid-template-columns:minmax(0,1fr)}
  .dp{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1024px){
  .auth{grid-template-columns:1fr}
  .auth-brand{display:none}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:2px}
}
@media (max-width:900px){

  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow-lg)}
  .shell.drawer .sidebar{transform:none}
  .shell.collapsed .sidebar .wordmark,.shell.collapsed .sidebar .sb-item span,.shell.collapsed .sidebar .sb-new span,.shell.collapsed .sidebar .sb-user .who,.shell.collapsed .sidebar .sb-new kbd{display:revert}
  .shell.collapsed .sidebar .sb-top{flex-direction:row;padding:0 2px 0 6px}
  .shell.collapsed .sidebar .sb-item,.shell.collapsed .sidebar .sb-new{justify-content:flex-start;padding:0 12px}
